        let currentSteps = [];

        function evalExpr(expr, vars) {
            let sanitized = expr.trim();
            const varNames = Object.keys(vars).sort((a, b) => b.length - a.length);
            for (let name of varNames) {
                const regex = new RegExp('\\b' + name + '\\b', 'g');
                sanitized = sanitized.replace(regex, vars[name]);
            }
            try {
                if (/^[0-9\s+\-*/%()]+$/.test(sanitized)) {
                    return Function(`'use strict'; return (${sanitized})`)();
                }
            } catch (e) {}
            return 0;
        }

        function evalCond(condStr, vars) {
            let sanitized = condStr.trim();
            const varNames = Object.keys(vars).sort((a, b) => b.length - a.length);
            for (let name of varNames) {
                const regex = new RegExp('\\b' + name + '\\b', 'g');
                sanitized = sanitized.replace(regex, vars[name]);
            }
            try {
                return Boolean(Function(`'use strict'; return (${sanitized})`)());
            } catch (e) {
                return false;
            }
        }

        function runSimulation(codeStr) {
            const lines = codeStr.split('\n');
            const steps = [];
            let vars = {};
            let output = [];
            let loopCounter = 0;

            function recordStep(lineIdx, desc) {
                steps.push({
                    line: lineIdx,
                    vars: { ...vars },
                    output: [...output],
                    desc: desc
                });
            }

            function findMatchingBrace(startIdx) {
                let depth = 0;
                for (let i = startIdx; i < lines.length; i++) {
                    if (lines[i].includes('{')) depth += (lines[i].match(/\{/g) || []).length;
                    if (lines[i].includes('}')) {
                        depth -= (lines[i].match(/\}/g) || []).length;
                        if (depth <= 0) return i;
                    }
                }
                return lines.length - 1;
            }

            // Core Execution Range function
            function execRange(start, end) {
                let i = start;
                while (i <= end) {
                    if (steps.length > 2000) {
                        throw new Error("執行步驟超過 2000 步，已終止以防程式掛起。");
                    }

                    const rawLine = lines[i];
                    const line = rawLine ? rawLine.trim() : '';

                    if (!line || line.startsWith('//') || line.startsWith('#') || line.startsWith('using') || line === '}' || line.startsWith('return') || line.includes('int main()')) {
                        i++;
                        continue;
                    }

                    // 1. cout Statement
                    if (line.startsWith('cout')) {
                        let parts = line.replace(/^cout\s*<<\s*/, '').replace(/;\s*$/, '').split('<<');
                        let lineOutput = '';
                        for (let part of parts) {
                            part = part.trim();
                            if (part === 'endl') {
                                lineOutput += '\n';
                            } else if (part.startsWith('"') && part.endsWith('"')) {
                                lineOutput += part.slice(1, -1);
                            } else if (part.startsWith('"') && part.includes('"')) {
                                let strMatch = part.match(/^"([^"]*)"/);
                                if (strMatch) lineOutput += strMatch[1];
                            } else {
                                lineOutput += evalExpr(part, vars);
                            }
                        }

                        if (output.length === 0) output.push('');
                        if (lineOutput.includes('\n')) {
                            const subLines = lineOutput.split('\n');
                            output[output.length - 1] += subLines[0];
                            for (let s = 1; s < subLines.length; s++) {
                                output.push(subLines[s]);
                            }
                        } else {
                            output[output.length - 1] += lineOutput;
                        }

                        recordStep(i, `螢幕印出文字: "${lineOutput.replace(/\n/g, '\\n')}"`);
                        i++;
                        continue;
                    }

                    // 2. Variable Declaration with Assignment
                    const declMatch = line.match(/^int\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+);$/);
                    if (declMatch) {
                        const varName = declMatch[1];
                        const val = evalExpr(declMatch[2], vars);
                        vars[varName] = val;
                        recordStep(i, `宣告 int 變數 ${varName} 並設初始值 = ${val}`);
                        i++;
                        continue;
                    }

                    // 3. Variable Assignment
                    const assignMatch = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+);$/);
                    if (assignMatch) {
                        const varName = assignMatch[1];
                        const val = evalExpr(assignMatch[2], vars);
                        vars[varName] = val;
                        recordStep(i, `計算並更新變數 ${varName} = ${val}`);
                        i++;
                        continue;
                    }

                    // 4. FOR LOOP
                    if (line.startsWith('for')) {
                        const forMatch = line.match(/for\s*\(\s*(?:int\s+)?([a-zA-Z0-9_]+)\s*=\s*([^;]+);\s*([^;]+);\s*(.+)\)\s*\{?/);
                        if (forMatch) {
                            const varName = forMatch[1];
                            const initVal = evalExpr(forMatch[2], vars);
                            const condStr = forMatch[3];
                            const stepExpr = forMatch[4];
                            const blockEnd = findMatchingBrace(i);

                            vars[varName] = initVal;
                            recordStep(i, `初始化 for 迴圈變數 ${varName} = ${initVal}`);

                            while (true) {
                                if (++loopCounter > 5000) throw new Error("迴圈次數過多！可能為無限迴圈");
                                const condVal = evalCond(condStr, vars);
                                recordStep(i, `檢查 for 條件 (${condStr}) -> ${condVal ? '成立，進入區塊' : '不成立，結束迴圈'}`);
                                if (!condVal) break;

                                execRange(i + 1, blockEnd - 1);

                                if (stepExpr.includes('++')) {
                                    vars[varName]++;
                                } else if (stepExpr.includes('--')) {
                                    vars[varName]--;
                                } else {
                                    const stepAssign = stepExpr.match(/([a-zA-Z0-9_]+)\s*=\s*(.+)/);
                                    if (stepAssign) {
                                        vars[stepAssign[1]] = evalExpr(stepAssign[2], vars);
                                    }
                                }
                                recordStep(i, `執行 for 遞增 (${stepExpr}) -> ${varName} 新值為 ${vars[varName]}`);
                            }
                            i = blockEnd + 1;
                            continue;
                        }
                    }

                    // 5. WHILE LOOP
                    if (line.startsWith('while') && !line.endsWith(';')) {
                        const whileMatch = line.match(/while\s*\(([^)]+)\)/);
                        if (whileMatch) {
                            const condStr = whileMatch[1];
                            const blockEnd = findMatchingBrace(i);

                            while (true) {
                                if (++loopCounter > 5000) throw new Error("迴圈次數過多！");
                                const condVal = evalCond(condStr, vars);
                                recordStep(i, `檢查 while 條件 (${condStr}) -> ${condVal ? '成立，執行迴圈體' : '不成立，跳出迴圈'}`);
                                if (!condVal) break;

                                execRange(i + 1, blockEnd - 1);
                            }
                            i = blockEnd + 1;
                            continue;
                        }
                    }

                    // 6. DO-WHILE LOOP
                    if (line.startsWith('do') && line.includes('{')) {
                        const blockEnd = findMatchingBrace(i);
                        const whileLine = lines[blockEnd] || '';
                        const condMatch = whileLine.match(/while\s*\(([^)]+)\);/);
                        const condStr = condMatch ? condMatch[1] : 'false';

                        do {
                            if (++loopCounter > 5000) throw new Error("迴圈次數過多！");
                            recordStep(i, `進入 do-while 區塊 (無條件執行至少一次)`);
                            execRange(i + 1, blockEnd - 1);

                            const condVal = evalCond(condStr, vars);
                            recordStep(blockEnd, `檢查 do-while 條件 (${condStr}) -> ${condVal ? '成立，繼續迴圈' : '不成立，結束迴圈'}`);
                            if (!condVal) break;
                        } while (true);

                        i = blockEnd + 1;
                        continue;
                    }

                    // 7. IF-ELSE Branch
                    if (line.startsWith('if')) {
                        let handled = false;
                        let currLineIdx = i;

                        while (currLineIdx <= end) {
                            const cLine = lines[currLineIdx] ? lines[currLineIdx].trim() : '';
                            if (cLine.startsWith('if') || cLine.startsWith('else if')) {
                                const condMatch = cLine.match(/(?:if|else\s+if)\s*\(([^)]+)\)/);
                                const blockEnd = findMatchingBrace(currLineIdx);

                                if (!handled) {
                                    const condStr = condMatch ? condMatch[1] : 'true';
                                    const condVal = evalCond(condStr, vars);
                                    recordStep(currLineIdx, `檢查條件 (${condStr}) -> ${condVal ? '成立，進入此分支' : '不成立'}`);

                                    if (condVal) {
                                        handled = true;
                                        execRange(currLineIdx + 1, blockEnd - 1);
                                    }
                                } else {
                                    recordStep(currLineIdx, `跳過條件分支 (先前條件已滿足)`);
                                }

                                currLineIdx = blockEnd + 1;
                                if (currLineIdx <= end) {
                                    const nextL = lines[currLineIdx] ? lines[currLineIdx].trim() : '';
                                    if (nextL.startsWith('else')) continue;
                                }
                                break;
                            } else if (cLine.startsWith('else')) {
                                const blockEnd = findMatchingBrace(currLineIdx);
                                if (!handled) {
                                    handled = true;
                                    recordStep(currLineIdx, `進入 else 分支`);
                                    execRange(currLineIdx + 1, blockEnd - 1);
                                } else {
                                    recordStep(currLineIdx, `跳過 else 分支 (先前條件已滿足)`);
                                }
                                currLineIdx = blockEnd + 1;
                                break;
                            } else {
                                break;
                            }
                        }

                        i = currLineIdx;
                        continue;
                    }

                    i++;
                }
            }

            execRange(0, lines.length - 1);
            return steps;
        }

        function loadExample(key) {
            stopPlay();
            const code = EXAMPLES[key];
            const container = document.getElementById('code-container');
            container.innerHTML = '';

            const lines = code.split('\n');
            lines.forEach((lineText, idx) => {
                const lineDiv = document.createElement('div');
                lineDiv.id = `line-${idx}`;
                lineDiv.className = 'flex items-center px-3 py-0.5 rounded transition-colors';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'w-8 text-right pr-4 text-slate-600 select-none text-xs font-mono';
                numSpan.innerText = idx + 1;

                const textSpan = document.createElement('span');
                textSpan.className = 'text-slate-200 whitespace-pre';
                textSpan.innerText = lineText;

                lineDiv.appendChild(numSpan);
                lineDiv.appendChild(textSpan);
                container.appendChild(lineDiv);
            });

            try {
                currentSteps = runSimulation(code);
            } catch (err) {
                console.error("Simulation error:", err);
                currentSteps = [{
                    line: 0,
                    vars: {},
                    output: [`錯誤: ${err.message}`],
                    desc: `程式解析出錯`
                }];
            }

            currentStepIdx = 0;
            renderStep();
        }

        function renderStep() {
            if (currentSteps.length === 0) return;
            const step = currentSteps[currentStepIdx];

            // 1. Highlight line
            document.querySelectorAll('#code-container > div').forEach(el => el.classList.remove('line-highlight'));
            const activeLine = document.getElementById(`line-${step.line}`);
            if (activeLine) {
                activeLine.classList.add('line-highlight');
                activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            // 2. Step Counter & Description
            document.getElementById('step-counter').innerText = `步驟 ${currentStepIdx + 1} / ${currentSteps.length}`;
            document.getElementById('step-description').innerText = step.desc;

            // 3. Render Variables Memory Grid
            const varsContainer = document.getElementById('variables-container');
            varsContainer.innerHTML = '';
            const keys = Object.keys(step.vars);

            if (keys.length === 0) {
                varsContainer.innerHTML = `
                    <div class="col-span-full text-center py-8 text-slate-500 text-sm">
                        尚未初始化任何變數
                    </div>`;
            } else {
                keys.forEach(key => {
                    const val = step.vars[key];
                    const card = document.createElement('div');
                    card.className = 'var-card bg-slate-800 border border-slate-700/80 rounded-xl p-3 flex flex-col justify-between shadow-md relative overflow-hidden';
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-blue-400 font-mono">${key}</span>
                            <span class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">int</span>
                        </div>
                        <div class="text-xl font-bold font-mono text-emerald-400 text-right">${val}</div>
                    `;
                    varsContainer.appendChild(card);
                });
            }

            // 4. Console Output Render
            const consoleEl = document.getElementById('console-output');
            consoleEl.innerText = step.output.join('\n');
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function stopPlay() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
                const playBtn = document.getElementById('btn-play');
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i> 播放';
                playBtn.classList.replace('bg-amber-600', 'bg-blue-600');
            }
        }

        window.onload = function() {
            const selectEl = document.getElementById('example-select');
            selectEl.addEventListener('change', (e) => loadExample(e.target.value));

            document.getElementById('btn-next').addEventListener('click', () => {
                stopPlay();
                if (currentStepIdx < currentSteps.length - 1) {
                    currentStepIdx++;
                    renderStep();
                }
            });

            document.getElementById('btn-prev').addEventListener('click', () => {
                stopPlay();
                if (currentStepIdx > 0) {
                    currentStepIdx--;
                    renderStep();
                }
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                stopPlay();
                currentStepIdx = 0;
                renderStep();
            });

            const playBtn = document.getElementById('btn-play');
            playBtn.addEventListener('click', () => {
                if (playInterval) {
                    stopPlay();
                } else {
                    if (currentStepIdx >= currentSteps.length - 1) {
                        currentStepIdx = 0;
                    }
                    playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> 暫停';
                    playBtn.classList.replace('bg-blue-600', 'bg-amber-600');

                    playInterval = setInterval(() => {
                        if (currentStepIdx < currentSteps.length - 1) {
                            currentStepIdx++;
                            renderStep();
                        } else {
                            stopPlay();
                        }
                    }, animationSpeed);
                }
            });

            const speedSlider = document.getElementById('speed-slider');
            const speedText = document.getElementById('speed-text');
            speedSlider.addEventListener('input', (e) => {
                animationSpeed = parseInt(e.target.value);
                speedText.innerText = `${animationSpeed}ms`;
                if (playInterval) {
                    stopPlay();
                    playBtn.click();
                }
            });

            // Initial load
            loadExample('ex1_vars');
        };
    </script>
