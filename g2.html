<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際測量師：三角航路 (Trig Odyssey)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* 科幻 HUD 介面 */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }
        .interactive {
            pointer-events: auto;
        }
        /* 頂部狀態列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 12px 24px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .game-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .stats-group {
            display: flex;
            gap: 24px;
            font-size: 14px;
        }
        .stat-item span {
            color: #38bdf8;
            font-weight: bold;
            font-size: 16px;
        }

        /* 底部操作面板 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }
        .panel-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .mission-title {
            font-size: 16px;
            color: #38bdf8;
            font-weight: 600;
        }
        .badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .mission-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 14px;
        }
        .telemetry-box {
            background: rgba(2, 6, 23, 0.6);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #7dd3fc;
            margin-bottom: 14px;
        }

        /* 輸入與互動區 */
        .input-group {
            display: flex;
            gap: 12px;
        }
        input[type="number"] {
            flex: 1;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            padding: 10px 16px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }
        input[type="number"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        button.btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }
        button.btn-primary:hover {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        button.btn-primary:active {
            transform: translateY(1px);
        }

        /* 輔助面板 */
        .formula-card {
            font-size: 13px;
            color: #94a3b8;
        }
        .formula-title {
            color: #e2e8f0;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .formula-content {
            background: rgba(2, 6, 23, 0.4);
            padding: 10px;
            border-radius: 6px;
            line-height: 1.5;
            font-family: 'Courier New', Courier, monospace;
            color: #a5f3fc;
        }

        /* 躍遷反饋訊息 */
        #feedback-toast {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 36px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        #feedback-toast.success {
            background: rgba(6, 78, 59, 0.9);
            color: #34d399;
            border: 1px solid #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
        #feedback-toast.error {
            background: rgba(127, 29, 29, 0.9);
            color: #f87171;
            border: 1px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <!-- 頂部 HUD -->
        <div class="top-bar interactive">
            <div class="game-title">✦ TRIG ODYSSEY // 星際測量師</div>
            <div class="stats-group">
                <div class="stat-item">當前星域：<span id="sector-display">1 / 4</span></div>
                <div class="stat-item">艦載能量：<span id="energy-display">100%</span></div>
                <div class="stat-item">測量精確度：<span id="score-display">100</span></div>
            </div>
        </div>

        <!-- 躍遷通知 -->
        <div id="feedback-toast">躍遷座標鎖定！超空間跳躍發動！</div>

        <!-- 底部控制面板 -->
        <div class="control-panel interactive">
            <!-- 任務與數值輸入 -->
            <div class="panel-card">
                <div class="mission-header">
                    <div class="mission-title" id="mission-title">載入航行日誌...</div>
                    <div class="badge" id="math-topic">數學單元</div>
                </div>
                <div class="mission-desc" id="mission-desc">正在掃描前方引力透鏡與信標...</div>
                
                <div class="telemetry-box" id="telemetry-data">
                    [TELEMETRY LOG]
                </div>

                <div class="input-group">
                    <input type="number" id="calc-input" placeholder="請輸入測量計算之目標值 (取整數或小數一位)" step="any" />
                    <button class="btn-primary" id="btn-submit">發動曲率躍遷</button>
                </div>
            </div>

            <!-- 艦載資料庫 / 公式支援 -->
            <div class="panel-card formula-card">
                <div class="formula-title">
                    <span>📡 導航公式庫 (Navigation Codex)</span>
                </div>
                <div class="formula-content" id="formula-help">
                    公式載入中...
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* -------------------------------------------------------------
           1. 關卡與數學題目設計 (高一數學：三角比、餘弦、正弦、數列)
        ------------------------------------------------------------- */
        const MISSIONS = [
            {
                sector: 1,
                title: "星區一：半人馬座直角測距",
                topic: "銳角三角比",
                desc: "泰坦號探測到空間斷層。已知星艦與定位信標 A 距離為 80 AU，且觀測目標星球與信標 A 的仰角為 30°（如 3D 視圖所示的直角三角形）。請計算目標星球與星艦的直線距離（斜邊長度）。",
                telemetry: "已知邊鄰邊 b = 80 AU\n觀測視角 θ = 30°\ncos(30°) ≈ 0.866, sin(30°) = 0.5\n求斜邊長度 c = b / cos(30°)",
                targetVal: 92.4,
                tolerance: 0.8,
                formula: "直角三角形三角比：\ncos(θ) = 鄰邊 / 斜邊\n=> 斜邊 = 鄰邊 / cos(θ)\n(80 / 0.866 ≈ 92.4)",
                points: {
                    ship: [0, 0, 0],
                    beacon: [80, 0, 0],
                    target: [80, 46.2, 0]
                }
            },
            {
                sector: 2,
                title: "星區二：獵戶座雙信標躍遷",
                topic: "餘弦定理 (Law of Cosines)",
                desc: "前方遭遇星雲阻隔，需直接躍遷至信標 B。雷達測得星艦至信標 A 為 80 AU，至信標 B 為 50 AU，兩信標夾角為 60°。請使用餘弦定理計算信標 A 與 B 之間的航道距離。",
                telemetry: "邊長 b = 80 AU, c = 50 AU\n夾角 ∠A = 60° (cos 60° = 0.5)\n餘弦公式：a² = b² + c² - 2bc*cos(A)",
                targetVal: 70,
                tolerance: 0.5,
                formula: "餘弦定理：\na² = 80² + 50² - 2(80)(50)cos(60°)\na² = 6400 + 2500 - 4000 = 4900\n=> a = 70 AU",
                points: {
                    ship: [0, 0, 0],
                    beacon: [80, 0, 0],
                    target: [25, 43.3, 0] // 50 * cos(60), 50 * sin(60)
                }
            },
            {
                sector: 3,
                title: "星區三：天鵝座深空三角定位",
                topic: "正弦定理 (Law of Sines)",
                desc: "主雷達僅接收到相位角。在 △ABC 中，已知基準邊長 c = 141.4 AU (100√2)，角度 ∠A = 45°，∠C = 30°。請計算星艦飛往目標星點 A 邊長度。",
                telemetry: "已知邊 c = 141.4 AU\n∠A = 45° (sin 45° ≈ 0.707)\n∠C = 30° (sin 30° = 0.5)\n正弦公式：a / sin(A) = c / sin(C)",
                targetVal: 200,
                tolerance: 1.0,
                formula: "正弦定理：\na = c * (sin A / sin C)\na = 141.4 * (0.707 / 0.5)\n=> a ≈ 200 AU",
                points: {
                    ship: [0, 0, 0],
                    beacon: [141.4, 0, 0],
                    target: [100, 100, 0]
                }
            },
            {
                sector: 4,
                title: "星區四：曲率引擎能量矩陣",
                topic: "等差數列級數 (Arithmetic Series)",
                desc: "抵達最終蟲洞！躍遷核心需注入 10 組脈衝能量。第一組能量 a₁ = 3 MW，後續每組公差 d = 4 MW。請計算 10 組脈衝的總能量 S₁₀ 以激活蟲洞。",
                telemetry: "項數 n = 10, 首項 a₁ = 3, 公差 d = 4\n第10項 a₁₀ = a₁ + (n-1)d = 39\n級數總和 Sₙ = n * (a₁ + aₙ) / 2",
                targetVal: 210,
                tolerance: 0.1,
                formula: "等差級數公式：\nS₁₀ = 10 * (3 + 39) / 2\nS₁₀ = 10 * 42 / 2\n=> S₁₀ = 210 MW",
                points: {
                    ship: [0, 0, 0],
                    beacon: [50, 20, 30],
                    target: [120, 60, -40]
                }
            }
        ];

        /* -------------------------------------------------------------
           2. Web Audio 科幻音效合成器
        ------------------------------------------------------------- */
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playLaser() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },
            playSuccess() {
                this.init();
                const now = this.ctx.currentTime;
                [440, 554.37, 659.25, 880].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.4);
                });
            },
            playError() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        };

        /* -------------------------------------------------------------
           3. Three.js 3D 星際場景建構
        ------------------------------------------------------------- */
        let scene, camera, renderer;
        let shipGroup, starParticles, lineGroup;
        let currentMissionIndex = 0;
        let isWarping = false;
        let score = 100;
        let energy = 100;

        function initThree() {
            const container = document.getElementById('webgl-container');
            
            // 場景與相機
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(-60, 50, 140);
            camera.lookAt(40, 20, 0);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // 環境光與點光源
            const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0x38bdf8, 2.5, 600);
            sunLight.position.set(0, 80, 100);
            scene.add(sunLight);

            // 1. 建立星空粒子背景
            createStarfield();

            // 2. 建立星艦模型
            createStarship();

            // 3. 建立幾何導航線路群組
            lineGroup = new THREE.Group();
            scene.add(lineGroup);

            // 載入當前關卡幾何物件
            loadMissionGeometry(MISSIONS[currentMissionIndex]);

            // 事件監聽
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 星空背景粒子
        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2000;
            const posArray = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                posArray[i] = (Math.random() - 0.5) * 1200;
                posArray[i + 1] = (Math.random() - 0.5) * 1200;
                posArray[i + 2] = (Math.random() - 0.5) * 1200;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const starMat = new THREE.PointsMaterial({
                size: 2,
                color: 0x93c5fd,
                transparent: true,
                opacity: 0.8
            });
            starParticles = new THREE.Points(starGeo, starMat);
            scene.add(starParticles);
        }

        // 程序化建構科幻星艦
        function createStarship() {
            shipGroup = new THREE.Group();

            // 艦身主體
            const bodyGeo = new THREE.ConeGeometry(3, 14, 5);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x0284c7,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0x082f49
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            shipGroup.add(body);

            // 艦翼
            const wingGeo = new THREE.BoxGeometry(16, 0.4, 6);
            const wingMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                metalness: 0.9,
                roughness: 0.3
            });
            const wing = new THREE.Mesh(wingGeo, wingMat);
            wing.position.set(0, 0, -2);
            shipGroup.add(wing);

            // 推進引擎光效
            const engineGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const engineMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const engine = new THREE.Mesh(engineGeo, engineMat);
            engine.position.set(0, 0, -7);
            shipGroup.add(engine);

            shipGroup.position.set(0, 0, 0);
            scene.add(shipGroup);
        }

        // 載入關卡 3D 幾何引導線與信標星球
        function loadMissionGeometry(mission) {
            // 清除舊線條
            while (lineGroup.children.length > 0) {
                lineGroup.remove(lineGroup.children[0]);
            }

            const pShip = new THREE.Vector3(...mission.points.ship);
            const pBeacon = new THREE.Vector3(...mission.points.beacon);
            const pTarget = new THREE.Vector3(...mission.points.target);

            // 建立信標與目標星球
            createBeaconMesh(pBeacon, 0xf59e0b, "Beacon A");
            createBeaconMesh(pTarget, 0x10b981, "Target Planet");

            // 繪製幾何三角形連線
            const linePoints = [pShip, pBeacon, pTarget, pShip];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
            const lineMat = new THREE.LineDashedMaterial({
                color: 0x38bdf8,
                dashSize: 3,
                gapSize: 1.5,
                linewidth: 2
            });
            const line = new THREE.Line(lineGeo, lineMat);
            line.computeLineDistances();
            lineGroup.add(line);

            // 目標星球光環
            const ringGeo = new THREE.RingGeometry(6, 7.5, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pTarget);
            ring.rotation.x = Math.PI / 2;
            lineGroup.add(ring);
        }

        function createBeaconMesh(pos, colorHex, label) {
            const geo = new THREE.SphereGeometry(3.5, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: 0.6,
                roughness: 0.3
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            lineGroup.add(mesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 主渲染循環
        function animate() {
            requestAnimationFrame(animate);

            // 星空粒子緩慢旋轉
            if (starParticles) {
                starParticles.rotation.y += 0.0003;
                starParticles.rotation.x += 0.0001;
            }

            // 星艦待機懸浮微動
            if (shipGroup && !isWarping) {
                const time = Date.now() * 0.002;
                shipGroup.position.y = Math.sin(time) * 1.5;
                shipGroup.rotation.z = Math.sin(time * 0.5) * 0.05;
            }

            renderer.render(scene, camera);
        }

        /* -------------------------------------------------------------
           4. 遊戲邏輯與 UI 交互整合
        ------------------------------------------------------------- */
        function updateHUD() {
            const cur = MISSIONS[currentMissionIndex];
            document.getElementById('sector-display').textContent = `${cur.sector} / ${MISSIONS.length}`;
            document.getElementById('energy-display').textContent = `${energy}%`;
            document.getElementById('score-display').textContent = `${score}`;
            document.getElementById('mission-title').textContent = cur.title;
            document.getElementById('math-topic').textContent = cur.topic;
            document.getElementById('mission-desc').textContent = cur.desc;
            document.getElementById('telemetry-data').textContent = cur.telemetry;
            document.getElementById('formula-help').textContent = cur.formula;
            document.getElementById('calc-input').value = '';
            document.getElementById('calc-input').focus();
        }

        function showFeedback(msg, isSuccess) {
            const toast = document.getElementById('feedback-toast');
            toast.textContent = msg;
            toast.className = isSuccess ? 'success' : 'error';
            setTimeout(() => {
                toast.className = '';
            }, 2500);
        }

        // 發動躍遷動畫
        function triggerWarpAnimation(onComplete) {
            isWarping = true;
            SoundFX.playSuccess();
            const targetPos = new THREE.Vector3(...MISSIONS[currentMissionIndex].points.target);
            const startPos = shipGroup.position.clone();
            let progress = 0;

            const warpInterval = setInterval(() => {
                progress += 0.025;
                shipGroup.position.lerpVectors(startPos, targetPos, progress);
                camera.position.z -= 0.8;

                if (progress >= 1) {
                    clearInterval(warpInterval);
                    setTimeout(() => {
                        shipGroup.position.set(0, 0, 0);
                        camera.position.set(-60, 50, 140);
                        isWarping = false;
                        onComplete();
                    }, 800);
                }
            }, 16);
        }

        // 提交計算結果
        document.getElementById('btn-submit').addEventListener('click', () => {
            const inputVal = parseFloat(document.getElementById('calc-input').value);
            const cur = MISSIONS[currentMissionIndex];

            if (isNaN(inputVal)) {
                showFeedback("⚠️ 請在導航計算機中輸入數值！", false);
                SoundFX.playError();
                return;
            }

            SoundFX.playLaser();

            // 數值驗證（允許誤差範圍）
            if (Math.abs(inputVal - cur.targetVal) <= cur.tolerance) {
                showFeedback("✨ 空間座標計算精確！曲率跳躍成功！", true);
                score += 25;
                energy = Math.min(100, energy + 10);

                triggerWarpAnimation(() => {
                    if (currentMissionIndex < MISSIONS.length - 1) {
                        currentMissionIndex++;
                        loadMissionGeometry(MISSIONS[currentMissionIndex]);
                        updateHUD();
                    } else {
                        showFeedback("🏆 恭喜！您已成功引導泰坦號穿越四大星域！", true);
                        document.getElementById('mission-desc').textContent = "航行全數完成！全艦已安全抵達母星系！";
                    }
                });
            } else {
                showFeedback("❌ 躍遷向量偏離！請重新校準幾何計算", false);
                SoundFX.playError();
                energy = Math.max(0, energy - 15);
                score = Math.max(0, score - 10);
                updateHUD();
            }
        });

        // 監聽 Enter 鍵快速提交
        document.getElementById('calc-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('btn-submit').click();
            }
        });

        // 啟動遊戲
        window.onload = () => {
            initThree();
            updateHUD();
        };
    </script>
</body>
</html>
