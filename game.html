<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Many Dudes? Lite (v3.0 P1 階梯協同/遺物/擊殺掉錢)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin: 5px 0;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
        }
        .subtitle {
            color: #888;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #game-container {
            width: 900px;
            background-color: #16213e;
            border: 3px solid #0f3460;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gold { color: #f39c12; }
        .lives { color: #e74c3c; }
        .wave { color: #3498db; }

        /* Battle Arena */
        #arena-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Synergy & Relic Panels */
        .info-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .panel-box {
            flex: 1;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-height: 75px;
        }
        .panel-title {
            font-size: 14px;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .synergy-tag, .relic-tag {
            display: inline-block;
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 2px;
        }
        .synergy-tag.active {
            background: #22c55e;
            color: #000;
            font-weight: bold;
        }
        .relic-tag {
            background: #8b5cf6;
            color: #fff;
            font-weight: bold;
        }

        /* Modal Overlay for Relic Choice */
        #relic-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 12px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #relic-modal.show {
            display: flex;
        }
        .modal-title {
            font-size: 22px;
            color: #f1c40f;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .relic-choices {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        .relic-card {
            background: #1e293b;
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            padding: 15px;
            width: 240px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .relic-card:hover {
            transform: translateY(-4px);
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .relic-icon { font-size: 32px; margin-bottom: 8px; }
        .relic-name { font-weight: bold; font-size: 16px; margin-bottom: 6px; color: #e9d5ff; }
        .relic-desc { font-size: 12px; color: #cbd5e1; }

        /* Shop Section */
        .shop-section {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .shop-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { background: #2563eb; transform: translateY(-1px); }
        .btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
        .btn-speed { background: #10b981; }
        .btn-speed:hover { background: #059669; }
        .btn-battle { background: #ef4444; font-size: 16px; padding: 10px 24px; }
        .btn-battle:hover { background: #dc2626; }
        .btn-reroll { background: #8b5cf6; }
        .btn-reroll:hover { background: #7c3aed; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .dude-card {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dude-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .dude-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .dude-family {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
            width: fit-content;
        }
        .family-undead { background: #581c87; color: #e9d5ff; }
        .family-warrior { background: #991b1b; color: #fecaca; }
        .family-fantasy { background: #1e3a8a; color: #bfdbfe; }
        .family-employed { background: #854d0e; color: #fef08a; }

        .dude-stats {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .dude-desc {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
            height: 32px;
        }
        .dude-price {
            font-weight: bold;
            color: #f39c12;
            text-align: right;
            font-size: 13px;
        }

        /* Log */
        #log-panel {
            margin-top: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            height: 80px;
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            color: #a7f3d0;
        }
    </style>
</head>
<body>

    <h1>How Many Dudes? Lite (v3.0 P1 升級版)</h1>
    <div class="subtitle">新增：2/4 階梯協同、三選一遺物選取、擊殺掉金幣、失敗保留累積金幣！</div>

    <div id="game-container">
        <!-- Relic Choice Modal -->
        <div id="relic-modal">
            <div class="modal-title">🔮 獲得強大遺物 (Relic Choice)</div>
            <div style="color:#aaa; font-size:14px; margin-bottom:20px;">選擇一項遺物以大幅改寫你的戰鬥規則：</div>
            <div class="relic-choices" id="relic-choices-container"></div>
        </div>

        <!-- Top Stats -->
        <div class="top-bar">
            <div class="stat-item wave">🌊 波次: <span id="ui-wave">1 / 10</span></div>
            <div class="stat-item gold">💰 金幣: $<span id="ui-gold">15</span></div>
            <div class="stat-item lives">❤️ 生命: <span id="ui-lives">3</span></div>
        </div>

        <!-- Battle Canvas -->
        <div id="arena-container">
            <canvas id="battleCanvas" width="870" height="320"></canvas>
        </div>

        <!-- Synergy & Relic Panels -->
        <div class="info-panel">
            <div class="panel-box">
                <div class="panel-title">👥 階梯協同加成 (2/4 Synergies)</div>
                <div id="synergy-list">尚未啟動協同</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">🔮 已持有遺物 (Relics)</div>
                <div id="relic-list">尚無遺物</div>
            </div>
        </div>

        <!-- Shop Area -->
        <div class="shop-section">
            <div class="shop-controls">
                <div>
                    <span>🛒 Dude 商店 (上限 8 位)</span>
                    <span style="font-size:12px; color:#888; margin-left:10px;">目前陣容: <span id="ui-dude-count">0</span>/8</span>
                </div>
                <div>
                    <button class="btn btn-speed" id="btn-speed" onclick="toggleSpeed()">⏩ 倍速: 1x</button>
                    <button class="btn btn-reroll" id="btn-reroll" onclick="rerollShop()">刷新商店 ($2)</button>
                    <button class="btn btn-battle" id="btn-battle" onclick="startBattle()">⚔️ 開始戰鬥！</button>
                </div>
            </div>

            <div class="cards-grid" id="shop-cards"></div>
        </div>

        <!-- Combat Log -->
        <div id="log-panel">
            [系統] 歡迎來到 Dude 牧場！敵人被擊殺時會直接掉落金幣，即使挑戰失敗金幣也會完整保留！
        </div>
    </div>

<script>
// Game State
const state = {
    gold: 15,
    lives: 3,
    wave: 1,
    maxWave: 10,
    inBattle: false,
    speed: 1,
    dudes: [],
    shop: [],
    relics: [], // Array of acquired relic objects
    maxDudes: 8
};

// Relics Database
const RELICS_DATABASE = [
    { id: 'cursed_book', icon: '📜', name: '詛咒之書', desc: '全隊攻擊力 +30%，但最大生命 -10%。' },
    { id: 'compound_interest', icon: '🏦', name: '複利契約', desc: '每波戰鬥開始時，獲取當前未花金幣 10% 的額外利息。' },
    { id: 'explosive_guts', icon: '💣', name: '爆裂內臟', desc: '所有友軍陣亡時觸發爆炸，造成 20 點小範圍 AOE 傷害。' },
    { id: 'golden_touch', icon: '🪙', name: '點金之觸', desc: '敵人被擊殺時，金幣掉落量 +$1。' },
    { id: 'blood_shield', icon: '🛡️', name: '吸血護盾', desc: '戰士與近戰單位每次攻擊恢復 3 點生命。' },
    { id: 'magic_overload', icon: '⚡', name: '魔力超載', desc: '奇幻族與遠程單位的攻擊射程與速度 +20%。' }
];

// Dude Database
const DUDE_TYPES = [
    { id: 'zombie', name: '殭屍 Dude', family: 'undead', hp: 35, atk: 6, range: 45, speed: 1.2, price: 3, desc: '死亡時觸發自爆綠色毒霧，對周圍造成 25 點 AOE 傷害！' },
    { id: 'skeleton', name: '骷髏 Dude', family: 'undead', hp: 20, atk: 8, range: 40, speed: 1.5, price: 2, desc: '近戰快速骨爪連擊。' },
    { id: 'warrior', name: '戰士 Dude', family: 'warrior', hp: 65, atk: 10, range: 40, speed: 1.0, price: 3, desc: '高血量前排肉盾。' },
    { id: 'berserker', name: '狂戰 Dude', family: 'warrior', hp: 45, atk: 16, range: 40, speed: 1.4, price: 4, desc: '高額近戰爆發輸出。' },
    { id: 'wizard', name: '巫師 Dude', family: 'fantasy', hp: 25, atk: 14, range: 200, speed: 0.8, price: 4, desc: '發射飛行火球，造成範圍爆破。' },
    { id: 'cleric', name: '牧師 Dude', family: 'fantasy', hp: 30, atk: 3, range: 160, speed: 0.9, price: 3, desc: '發射綠色治癒光線，修復傷勢最重的友軍 15 HP。' },
    { id: 'finance', name: '金融 Dude', family: 'employed', hp: 30, atk: 5, range: 110, speed: 1.0, price: 3, desc: '發射金幣投射物，通關獲得獎金。' },
    { id: 'cowboy', name: '牛仔 Dude', family: 'employed', hp: 40, atk: 12, range: 150, speed: 1.1, price: 4, desc: '發射黃色高速子彈連擊。' }
];

// Enemy Waves Config
const ENEMY_WAVES = [
    { name: '第 1 波：10 個幼童 (Toddlers)', count: 10, hp: 20, atk: 4, speed: 0.8, size: 10, color: '#f472b6', bounty: 1 },
    { name: '第 2 波：15 個幼童群 (Baby Horde)', count: 15, hp: 25, atk: 5, speed: 0.9, size: 10, color: '#f472b6', bounty: 1 },
    { name: '第 3 波：5 隻野狼 (Wolves)', count: 5, hp: 60, atk: 12, speed: 1.6, size: 16, color: '#94a3b8', bounty: 2 },
    { name: '第 4 波：8 隻野狼群 (Pack of Wolves)', count: 8, hp: 75, atk: 14, speed: 1.7, size: 16, color: '#94a3b8', bounty: 2 },
    { name: '第 5 波：中場 BOSS - 巨型鴨 (Horse-sized Duck)', count: 1, hp: 500, atk: 30, speed: 1.1, size: 30, color: '#facc15', bounty: 10 },
    { name: '第 6 波：20 個狂暴幼童 (Enraged Toddlers)', count: 20, hp: 40, atk: 8, speed: 1.3, size: 11, color: '#fb7185', bounty: 1 },
    { name: '第 7 波：3 隻大猩猩 (Gorillas)', count: 3, hp: 250, atk: 25, speed: 1.0, size: 22, color: '#475569', bounty: 5 },
    { name: '第 8 波：5 隻大猩猩隊 (Gorilla Squad)', count: 5, hp: 300, atk: 28, speed: 1.1, size: 22, color: '#334155', bounty: 5 },
    { name: '第 9 波：大猩猩與野狼混合軍', count: 10, hp: 200, atk: 22, speed: 1.4, size: 18, color: '#a855f7', bounty: 3 },
    { name: '第 10 波：最終 BOSS - 破滅之神 (THE GOD)', count: 1, hp: 1800, atk: 50, speed: 0.9, size: 40, color: '#ef4444', bounty: 50 }
];

// Canvas & Animation Setup
const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');

let combatEntities = [];
let combatProjectiles = [];
let combatParticles = [];
let battleAnimationId = null;
let screenShake = 0;

function init() {
    rerollShop();
    updateUI();
    drawIdleArena();
}

function toggleSpeed() {
    state.speed = state.speed === 1 ? 2 : 1;
    document.getElementById('btn-speed').innerText = `⏩ 倍速: ${state.speed}x`;
    log(`戰鬥速度已調整為 ${state.speed}x 倍速。`);
}

function log(msg) {
    const p = document.getElementById('log-panel');
    p.innerHTML += `<div>[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}</div>`;
    p.scrollTop = p.scrollHeight;
}

function updateUI() {
    document.getElementById('ui-gold').innerText = state.gold;
    document.getElementById('ui-lives').innerText = state.lives;
    document.getElementById('ui-wave').innerText = `${state.wave} / ${state.maxWave}`;
    document.getElementById('ui-dude-count').innerText = state.dudes.length;

    updateSynergiesUI();
    updateRelicsUI();
}

function updateSynergiesUI() {
    const counts = {};
    state.dudes.forEach(d => counts[d.family] = (counts[d.family] || 0) + 1);

    const list = document.getElementById('synergy-list');
    list.innerHTML = '';

    const familyNames = { undead: '不死族', warrior: '戰士族', fantasy: '奇幻族', employed: '上班族' };
    let hasActive = false;

    for (let fam in counts) {
        const count = counts[fam];
        let desc = '';
        let active = false;

        if (count >= 4) {
            active = true; hasActive = true;
            if (fam === 'undead') desc = '不死(4): 死亡 50% 機率召喚骷髏';
            if (fam === 'warrior') desc = '戰士(4): 獲得 20% 反傷護盾';
            if (fam === 'fantasy') desc = '奇幻(4): 攻擊附帶連鎖閃電';
            if (fam === 'employed') desc = '上班族(4): 開局獲得保險單(死掉+$5)';
        } else if (count >= 2) {
            active = true; hasActive = true;
            if (fam === 'undead') desc = '不死(2): 攻擊力+15%';
            if (fam === 'warrior') desc = '戰士(2): 最大生命+25%';
            if (fam === 'fantasy') desc = '奇幻(2): 射程+20%';
            if (fam === 'employed') desc = '上班族(2): 通關額外+$2';
        } else {
            desc = `${familyNames[fam]} (${count}/2)`;
        }

        const tag = document.createElement('span');
        tag.className = `synergy-tag ${active ? 'active' : ''}`;
        tag.innerText = desc;
        list.appendChild(tag);
    }

    if (!hasActive && Object.keys(counts).length === 0) {
        list.innerHTML = '<span style="color:#64748b; font-size:12px;">招募 2/4 位同家族 Dude 觸發階梯協同加成！</span>';
    }
}

function updateRelicsUI() {
    const list = document.getElementById('relic-list');
    list.innerHTML = '';

    if (state.relics.length === 0) {
        list.innerHTML = '<span style="color:#64748b; font-size:12px;">尚無遺物（將在指定關卡通關後獲得）</span>';
        return;
    }

    state.relics.forEach(r => {
        const tag = document.createElement('span');
        tag.className = 'relic-tag';
        tag.innerText = `${r.icon} ${r.name}`;
        tag.title = r.desc;
        list.appendChild(tag);
    });
}

function showRelicModal() {
    const available = RELICS_DATABASE.filter(r => !state.relics.some(owned => owned.id === r.id));
    if (available.length === 0) return;

    const choices = [...available].sort(() => 0.5 - Math.random()).slice(0, 3);
    const container = document.getElementById('relic-choices-container');
    container.innerHTML = '';

    choices.forEach(r => {
        const card = document.createElement('div');
        card.className = 'relic-card';
        card.onclick = () => selectRelic(r);
        card.innerHTML = `
            <div class="relic-icon">${r.icon}</div>
            <div class="relic-name">${r.name}</div>
            <div class="relic-desc">${r.desc}</div>
        `;
        container.appendChild(card);
    });

    document.getElementById('relic-modal').classList.add('show');
}

function selectRelic(relic) {
    state.relics.push(relic);
    document.getElementById('relic-modal').classList.remove('show');
    log(`🔮 成功選擇遺物【${relic.name}】！${relic.desc}`);
    updateUI();
}

function rerollShop() {
    if (state.gold < 2 && state.shop.length > 0) {
        log('金幣不足，無法刷新商店！');
        return;
    }
    if (state.shop.length > 0) state.gold -= 2;

    state.shop = [];
    for (let i = 0; i < 4; i++) {
        const randomType = DUDE_TYPES[Math.floor(Math.random() * DUDE_TYPES.length)];
        state.shop.push({ ...randomType });
    }
    renderShop();
    updateUI();
}

function renderShop() {
    const grid = document.getElementById('shop-cards');
    grid.innerHTML = '';

    state.shop.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'dude-card';
        card.onclick = () => buyDude(index);

        card.innerHTML = `
            <div>
                <div class="dude-name">${item.name}</div>
                <span class="dude-family family-${item.family}">${item.family.toUpperCase()}</span>
                <div class="dude-stats">❤️ HP: ${item.hp} | ⚔️ ATK: ${item.atk}</div>
                <div class="dude-desc">${item.desc}</div>
            </div>
            <div class="dude-price">💰 $${item.price}</div>
        `;
        grid.appendChild(card);
    });
}

function buyDude(index) {
    if (state.inBattle) return;
    if (state.dudes.length >= state.maxDudes) {
        log('陣容已滿（最多 8 位 Dude）！');
        return;
    }

    const item = state.shop[index];
    if (!item) return;

    if (state.gold < item.price) {
        log(`金幣不足！購買 ${item.name} 需要 $${item.price}。`);
        return;
    }

    state.gold -= item.price;
    state.dudes.push({ ...item });
    state.shop.splice(index, 1);

    log(`成功招募 ${item.name}！`);
    renderShop();
    updateUI();
    drawIdleArena();
}

function drawIdleArena() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    const startX = 80;
    const startY = 60;
    state.dudes.forEach((d, i) => {
        const x = startX + (i % 3) * 60;
        const y = startY + Math.floor(i / 3) * 70;

        ctx.fillStyle = getFamilyColor(d.family);
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.name.substring(0, 2), x, y + 4);
    });

    if (state.dudes.length === 0) {
        ctx.fillStyle = '#475569';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('尚無 Dude，請先從下方商店招募單位！', canvas.width / 2, canvas.height / 2);
    }
}

function getFamilyColor(family) {
    if (family === 'undead') return '#a855f7';
    if (family === 'warrior') return '#ef4444';
    if (family === 'fantasy') return '#3b82f6';
    if (family === 'employed') return '#eab308';
    return '#10b981';
}

function startBattle() {
    if (state.inBattle) return;
    if (state.dudes.length === 0) {
        log('你至少需要招募 1 位 Dude 才能開啟戰鬥！');
        return;
    }

    state.inBattle = true;
    document.getElementById('btn-battle').disabled = true;
    document.getElementById('btn-reroll').disabled = true;

    // Apply Compound Interest Relic
    if (state.relics.some(r => r.id === 'compound_interest')) {
        let interest = Math.floor(state.gold * 0.1);
        if (interest > 0) {
            state.gold += interest;
            log(`🏦【複利契約】獲得 $${interest} 利息！`);
            updateUI();
        }
    }

    const waveInfo = ENEMY_WAVES[state.wave - 1];
    log(`⚔️ 開始 ${waveInfo.name}！`);

    const counts = {};
    state.dudes.forEach(d => counts[d.family] = (counts[d.family] || 0) + 1);

    let atkBuff = counts['undead'] >= 2 ? 1.15 : 1.0;
    let hpBuff = counts['warrior'] >= 2 ? 1.25 : 1.0;
    let rangeBuff = counts['fantasy'] >= 2 ? 1.2 : 1.0;

    if (state.relics.some(r => r.id === 'cursed_book')) {
        atkBuff *= 1.30;
        hpBuff *= 0.90;
    }

    combatEntities = [];
    state.dudes.forEach((d, i) => {
        const col = i % 3;
        const row = Math.floor(i / 3);
        combatEntities.push({
            isDude: true,
            id: d.id,
            name: d.name,
            family: d.family,
            x: 60 + col * 50,
            y: 50 + row * 65,
            hp: Math.round(d.hp * hpBuff),
            maxHp: Math.round(d.hp * hpBuff),
            atk: Math.round(d.atk * atkBuff),
            range: d.range * (rangeBuff * (state.relics.some(r => r.id === 'magic_overload') ? 1.2 : 1.0)),
            speed: d.speed * (state.relics.some(r => r.id === 'magic_overload') ? 1.2 : 1.0),
            cooldown: 0,
            radius: 14,
            color: getFamilyColor(d.family)
        });
    });

    if (counts['employed'] >= 4 && combatEntities.length > 0) {
        let lucky = combatEntities[Math.floor(Math.random() * combatEntities.length)];
        lucky.hasInsurance = true;
    }

    for (let i = 0; i < waveInfo.count; i++) {
        combatEntities.push({
            isDude: false,
            name: 'Enemy',
            x: canvas.width - 80 - (Math.random() * 150),
            y: 40 + (Math.random() * (canvas.height - 80)),
            hp: waveInfo.hp,
            maxHp: waveInfo.hp,
            atk: waveInfo.atk,
            range: 35,
            speed: waveInfo.speed,
            bounty: waveInfo.bounty || 1,
            cooldown: 0,
            radius: waveInfo.size,
            color: waveInfo.color
        });
    }

    combatProjectiles = [];
    combatParticles = [];
    screenShake = 0;
    battleLoop();
}

function battleLoop() {
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (screenShake > 0) {
        const rx = (Math.random() - 0.5) * screenShake;
        const ry = (Math.random() - 0.5) * screenShake;
        ctx.translate(rx, ry);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
    }

    const gameSpeed = state.speed;

    const dudes = combatEntities.filter(e => e.isDude && e.hp > 0);
    const enemies = combatEntities.filter(e => !e.isDude && e.hp > 0);

    if (enemies.length === 0) {
        ctx.restore();
        endBattle(true);
        return;
    }
    if (dudes.length === 0) {
        ctx.restore();
        endBattle(false);
        return;
    }

    const counts = {};
    dudes.forEach(d => counts[d.family] = (counts[d.family] || 0) + 1);

    combatEntities.forEach(e => {
        if (e.hp <= 0) return;

        const targets = e.isDude ? enemies : dudes;
        let nearest = null;
        let minDist = 999999;

        targets.forEach(t => {
            const dist = Math.hypot(t.x - e.x, t.y - e.y);
            if (dist < minDist) {
                minDist = dist;
                nearest = t;
            }
        });

        if (nearest) {
            if (minDist <= e.range) {
                if (e.cooldown <= 0) {
                    e.cooldown = (50 / e.speed) / gameSpeed;

                    if (e.id === 'wizard' && e.isDude) {
                        combatProjectiles.push({
                            x: e.x, y: e.y, target: nearest, damage: e.atk,
                            speed: 5 * gameSpeed, radius: 6, color: '#f97316', type: 'fireball'
                        });
                    } else if (e.id === 'cowboy' && e.isDude) {
                        combatProjectiles.push({
                            x: e.x, y: e.y, target: nearest, damage: e.atk,
                            speed: 10 * gameSpeed, radius: 3, color: '#facc15', type: 'bullet'
                        });
                    } else if (e.id === 'cleric' && e.isDude) {
                        let lowestDude = dudes.sort((a, b) => a.hp - b.hp)[0];
                        if (lowestDude) {
                            lowestDude.hp = Math.min(lowestDude.maxHp, lowestDude.hp + 15);
                            combatParticles.push({
                                x: lowestDude.x, y: lowestDude.y, text: '+15 HP', color: '#4ade80', life: 25
                            });
                            combatParticles.push({
                                type: 'beam', x1: e.x, y1: e.y, x2: lowestDude.x, y2: lowestDude.y, color: '#22c55e', life: 10
                            });
                        }
                    } else {
                        nearest.hp -= e.atk;

                        if (e.isDude && state.relics.some(r => r.id === 'blood_shield')) {
                            e.hp = Math.min(e.maxHp, e.hp + 3);
                        }

                        if (!e.isDude && counts['warrior'] >= 4) {
                            e.hp -= Math.round(e.atk * 0.2);
                        }

                        if (e.isDude && counts['fantasy'] >= 4) {
                            let splashed = enemies.filter(en => en !== nearest && en.hp > 0).slice(0, 2);
                            splashed.forEach(s => {
                                s.hp -= Math.round(e.atk * 0.5);
                                combatParticles.push({
                                    type: 'beam', x1: nearest.x, y1: nearest.y, x2: s.x, y2: s.y, color: '#38bdf8', life: 8
                                });
                            });
                        }

                        combatParticles.push({
                            x: nearest.x, y: nearest.y, text: `-${e.atk}`, color: e.isDude ? '#f87171' : '#38bdf8', life: 25
                        });

                        // Enemy Death & Money Drop
                        if (nearest.hp <= 0 && !nearest.isDude) {
                            let droppedGold = nearest.bounty + (state.relics.some(r => r.id === 'golden_touch') ? 1 : 0);
                            state.gold += droppedGold;
                            updateUI();

                            combatParticles.push({
                                x: nearest.x, y: nearest.y - 10, text: `+$${droppedGold} 金幣`, color: '#f39c12', life: 35
                            });
                        }

                        // Dude Death Effects
                        if (nearest.hp <= 0 && nearest.isDude) {
                            if (nearest.hasInsurance) {
                                state.gold += 5;
                                updateUI();
                                combatParticles.push({ x: nearest.x, y: nearest.y, text: '+$5保險金', color: '#facc15', life: 35 });
                            }

                            if (counts['undead'] >= 4 && Math.random() < 0.5) {
                                combatEntities.push({
                                    isDude: true, id: 'skeleton', name: '小骷髏', family: 'undead',
                                    x: nearest.x, y: nearest.y, hp: 15, maxHp: 15, atk: 6, range: 40, speed: 1.5, cooldown: 0, radius: 10, color: '#e9d5ff'
                                });
                                combatParticles.push({ x: nearest.x, y: nearest.y, text: '💀 骷髏降臨', color: '#e9d5ff', life: 25 });
                            }

                            if (nearest.id === 'zombie' || state.relics.some(r => r.id === 'explosive_guts')) {
                                screenShake = 10;
                                combatParticles.push({ type: 'ring', x: nearest.x, y: nearest.y, radius: 10, maxRadius: 40, color: '#a855f7', life: 15 });
                                enemies.forEach(en => {
                                    if (Math.hypot(en.x - nearest.x, en.y - nearest.y) <= 60) {
                                        en.hp -= 20;
                                        combatParticles.push({ x: en.x, y: en.y, text: '-20爆破', color: '#c084fc', life: 25 });
                                    }
                                });
                            }
                        }
                    }
                }
            } else {
                const angle = Math.atan2(nearest.y - e.y, nearest.x - e.x);
                e.x += Math.cos(angle) * (e.speed * 1.5 * gameSpeed);
                e.y += Math.sin(angle) * (e.speed * 1.5 * gameSpeed);
            }
        }

        if (e.cooldown > 0) e.cooldown--;
    });

    combatProjectiles.forEach((p, idx) => {
        if (!p.target || p.target.hp <= 0) {
            combatProjectiles.splice(idx, 1);
            return;
        }

        const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        p.x += Math.cos(angle) * p.speed;
        p.y += Math.sin(angle) * p.speed;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        if (Math.hypot(p.target.x - p.x, p.target.y - p.y) <= p.target.radius + p.radius) {
            p.target.hp -= p.damage;
            combatParticles.push({
                x: p.target.x, y: p.target.y, text: `-${p.damage}`, color: '#fb923c', life: 25
            });

            if (p.target.hp <= 0 && !p.target.isDude) {
                let droppedGold = p.target.bounty + (state.relics.some(r => r.id === 'golden_touch') ? 1 : 0);
                state.gold += droppedGold;
                updateUI();
                combatParticles.push({
                    x: p.target.x, y: p.target.y - 10, text: `+$${droppedGold} 金幣`, color: '#f39c12', life: 35
                });
            }

            if (p.type === 'fireball') {
                screenShake = 6;
                combatParticles.push({
                    type: 'ring', x: p.x, y: p.y, radius: 5, maxRadius: 25, color: '#f97316', life: 12
                });
            }

            combatProjectiles.splice(idx, 1);
        }
    });

    combatEntities.forEach(e => {
        if (e.hp <= 0) return;

        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();

        const barW = e.radius * 2;
        const barH = 4;
        const hpPct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = '#334155';
        ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, barW, barH);
        ctx.fillStyle = e.isDude ? '#22c55e' : '#ef4444';
        ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, barW * hpPct, barH);
    });

    combatParticles.forEach((p, index) => {
        if (p.type === 'ring') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.stroke();
            p.radius += (p.maxRadius - p.radius) * 0.2;
        } else if (p.type === 'beam') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x1, p.y1);
            ctx.lineTo(p.x2, p.y2);
            ctx.stroke();
        } else {
            ctx.fillStyle = p.color;
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(p.text, p.x, p.y);
            p.y -= 0.5;
        }

        p.life--;
        if (p.life <= 0) combatParticles.splice(index, 1);
    });

    ctx.restore();
    battleAnimationId = requestAnimationFrame(battleLoop);
}

function endBattle(victory) {
    cancelAnimationFrame(battleAnimationId);
    state.inBattle = false;
    document.getElementById('btn-battle').disabled = false;
    document.getElementById('btn-reroll').disabled = false;

    if (victory) {
        const counts = {};
        state.dudes.forEach(d => counts[d.family] = (counts[d.family] || 0) + 1);

        let bonusGold = counts['employed'] >= 2 ? 2 : 0;
        let reward = 5 + state.wave * 2 + bonusGold;
        state.gold += reward;

        log(`🎉 勝利！波次結算獲得獎金 $${reward}。`);

        if ([3, 6, 9].includes(state.wave)) {
            setTimeout(showRelicModal, 500);
        }

        if (state.wave >= state.maxWave) {
            log('🏆【通關勝利】恭喜你擊敗破滅之神！帶領 Dude 大軍獲得最終勝利！');
            alert('🏆 恭喜通關《How Many Dudes? Lite》！');
            return;
        }

        state.wave++;
        rerollShop();
    } else {
        state.lives--;
        // Retain all accumulated gold when defeated
        log(`💀 戰敗！剩餘生命：${state.lives}。（已為你保留戰鬥中累積的所有 $${state.gold} 金幣！）`);

        if (state.lives <= 0) {
            log('💥【GAME OVER】你的 Dude 大軍覆滅了！點擊頁面重新整理即可再試一次。');
            alert(`💥 Game Over！所有生命已耗盡。本次最終獲得金幣：$${state.gold}`);
            location.reload();
            return;
        }
    }

    updateUI();
    drawIdleArena();
}

window.onload = init;
</script>
</body>
