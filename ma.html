<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>咒術小學初級咒師測試</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
      background-color: #0a0a0d;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.4px);
      background-size: 12px 12px;
      color: #e5e5e5;
    }
    .font-display { font-family: 'Noto Serif TC', serif; }
    .speedlines { background-image: repeating-linear-gradient(115deg, transparent 0 12px, rgba(255,255,255,0.05) 12px 13px); }
    .writing-vertical { writing-mode: vertical-rl; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #17171c; }
    ::-webkit-scrollbar-thumb { background: #7f1d1d; border-radius: 4px; }
    .touch-btn { transition: transform .1s ease, background-color .15s ease; }
    .touch-btn:active { transform: scale(0.96); }
    .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; padding: 0 4px; }
    .fraction .numerator { border-bottom: 2px solid currentColor; padding-bottom: 1px; }
    .fraction .denominator { padding-top: 1px; }
    .ripple {
      position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(255,90,90,.8) 0%, rgba(220,38,38,.45) 45%, transparent 70%);
      transform: scale(0); animation: rippleAnim .6s ease-out forwards;
    }
    @keyframes rippleAnim { to { transform: scale(2.6); opacity: 0; } }
    .energy-glow { animation: energyPulse .5s ease-out; }
    @keyframes energyPulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.8); } 100% { box-shadow: 0 0 0 14px rgba(220,38,38,0); } }
    .mascot-happy { animation: mascotBounce .7s ease; filter: drop-shadow(0 0 10px rgba(56,189,248,.9)); }
    .mascot-sad   { animation: mascotShake .5s ease; filter: grayscale(.6) drop-shadow(0 0 8px rgba(220,38,38,.9)); }
    .mascot-flash { animation: mascotBounce .45s ease 2; filter: drop-shadow(0 0 16px rgba(220,38,38,1)); }
    @keyframes mascotBounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-8px) scale(1.08)} 60%{transform:translateY(0) scale(1.02)} }
    @keyframes mascotShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px) rotate(-3deg)} 40%{transform:translateX(5px) rotate(3deg)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    #blackflash-overlay.show, #rankup-overlay.show { display: flex; animation: overlayAnim 1s ease forwards; }
    @keyframes overlayAnim { 0%{opacity:0} 12%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
    .flash-text { animation: flashZoom .9s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes flashZoom { 0%{transform:scale(.3) rotate(-8deg)} 20%{transform:scale(1.15) rotate(2deg)} 100%{transform:scale(1)} }
    @keyframes bounceShort { 0%{transform:scale(.8)} 60%{transform:scale(1.05)} 100%{transform:scale(1)} }
    .animate-bounce-short { animation: bounceShort .35s ease-out; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col text-neutral-200">

  <div class="hidden xl:block fixed right-2 top-1/3 z-0 writing-vertical font-display text-3xl font-black text-red-900/50 tracking-[0.5em] pointer-events-none select-none">咒術迴戰・祓除</div>

  <header class="bg-black speedlines text-white sticky top-0 z-30 border-b-4 border-red-600 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-2.5 flex flex-col md:flex-row md:items-center gap-2">
      <div class="flex items-center justify-between gap-2 flex-1 md:flex-none min-w-0">
        <div class="flex items-center space-x-2 min-w-0">
          <button id="toggle-sidebar-btn" class="p-2.5 rounded-lg bg-red-700 hover:bg-red-800 text-white md:hidden touch-btn border-2 border-black">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <span class="bg-red-600 text-white font-black px-2.5 py-1 rounded-md text-sm border-2 border-black shadow-[3px_3px_0_#000] font-display shrink-0">呪術</span>
          <div class="flex flex-col min-w-0">
            <h1 class="text-base sm:text-xl lg:text-2xl font-black tracking-wide font-display truncate">咒術小學初級咒師測試</h1>
            <span class="hidden sm:block text-[10px] text-red-400 font-bold tracking-widest">國小五年級上學期數學 × 咒術迴戰</span>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="sound-toggle-btn" onclick="toggleMute()" class="p-2.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 border-2 border-black touch-btn" title="音效開關">
            <i id="sound-icon" class="fa-solid fa-volume-high text-amber-400"></i>
          </button>
          <div id="energy-chip" class="flex items-center gap-2 bg-neutral-900 border-2 border-red-700 rounded-lg px-2.5 py-1.5">
            <i class="fa-solid fa-bolt text-amber-400"></i>
            <div class="flex flex-col leading-none gap-1">
              <span id="rank-name" class="text-[10px] sm:text-xs font-black text-red-400">四級咒術師</span>
              <span class="flex items-center gap-1.5">
                <span id="energy-value" class="font-mono text-xs sm:text-sm font-bold text-amber-300">0</span>
                <span class="hidden sm:block w-16 h-1.5 bg-neutral-700 rounded-full overflow-hidden">
                  <span id="energy-bar" class="block h-full bg-gradient-to-r from-red-600 to-amber-400 transition-all duration-500" style="width:0%"></span>
                </span>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="flex bg-neutral-900 p-1 rounded-xl border-2 border-neutral-700 text-xs sm:text-sm font-bold w-full md:w-auto md:ml-auto">
        <button id="mode-teach-btn" onclick="switchMode('teach')" class="flex-1 md:flex-none px-3 py-2 sm:px-4 rounded-lg bg-red-600 text-white border-2 border-black shadow-[3px_3px_0_#000] font-bold">
          <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>咒術教學<span class="hidden lg:inline"> (50)</span>
        </button>
        <button id="mode-real-btn" onclick="switchMode('real')" class="flex-1 md:flex-none px-3 py-2 sm:px-4 rounded-lg text-neutral-300 hover:text-white hover:bg-neutral-800 border-2 border-transparent font-bold">
          <i class="fa-solid fa-pen-clip text-emerald-400 mr-1"></i>等級檢定<span class="hidden lg:inline"> (50)</span>
        </button>
        <button id="mode-hard-btn" onclick="switchMode('hard')" class="flex-1 md:flex-none px-3 py-2 sm:px-4 rounded-lg text-neutral-300 hover:text-white hover:bg-neutral-800 border-2 border-transparent font-bold">
          <i class="fa-solid fa-fire text-rose-500 mr-1"></i>領域展開<span class="hidden lg:inline"> (50)</span>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col md:flex-row p-3 sm:p-5 gap-4 relative z-10 pb-20 md:pb-4">

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 max-w-[85vw] transform -translate-x-full transition-transform duration-300 ease-in-out md:static md:translate-x-0 md:w-72 lg:w-80 md:transition-none flex flex-col shrink-0 overflow-hidden bg-neutral-900 border-2 border-red-700 md:border-black md:shadow-[6px_6px_0_rgba(220,38,38,0.5)] rounded-none md:rounded-xl">
      <div class="p-3 pb-0">
        <img src="images/jjk-banner.jpg" alt="咒術迴戰橫幅" class="w-full h-24 lg:h-28 object-cover rounded-lg border-2 border-black shadow-[4px_4px_0_#7f1d1d]">
      </div>
      <div class="p-4 pb-3 bg-neutral-900 border-b-2 border-red-900 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-layer-group text-red-500"></i>
          <h2 class="font-bold text-neutral-200 text-sm">咒術卷軸導覽</h2>
        </div>
        <span id="current-mode-badge" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-bold border border-amber-600">咒術教學模式</span>
      </div>
      <div class="p-3 flex-1 overflow-y-auto">
        <div class="text-xs font-bold text-neutral-500 mb-2 flex justify-between items-center">
          <span>咒靈祓除列表（點單元展開）</span>
          <span id="progress-text" class="text-red-400">已祓除 0 / 50</span>
        </div>
        <div id="unit-accordion" class="space-y-2"></div>
      </div>
      <div class="p-4 bg-neutral-900 border-t-2 border-red-900 space-y-3">
        <div id="test-timer-box" class="hidden items-center justify-between bg-red-950/40 p-3 rounded-xl border border-red-800">
          <span class="text-xs font-bold text-red-300"><i class="fa-regular fa-clock mr-1"></i>施術時間</span>
          <span id="timer-display" class="font-mono font-bold text-red-100 text-lg">00:00</span>
        </div>
        <button onclick="submitCurrentQuiz()" class="w-full py-3 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold rounded-xl text-sm flex items-center justify-center space-x-2 touch-btn border-2 border-black shadow-[4px_4px_0_#000]">
          <i class="fa-solid fa-check-circle"></i><span>送出檢定・評定等級</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col gap-3 sm:gap-4 min-w-0">
      <div class="flex items-center justify-between flex-wrap gap-2 pb-3 border-b border-neutral-800">
        <div class="flex items-center space-x-2 sm:space-x-3 flex-wrap">
          <span id="q-number-badge" class="bg-red-600 text-white font-black px-3 py-1 rounded-lg text-lg border-2 border-black shadow-[3px_3px_0_#000] font-display">第 1 題</span>
          <span id="q-unit-tag" class="bg-neutral-800 text-neutral-200 text-xs sm:text-sm font-bold px-3 py-1 rounded-md border border-neutral-600">單元：1. 因數與倍數</span>
          <span id="q-diff-tag" class="bg-red-500/10 text-red-300 text-xs font-bold px-2.5 py-1 rounded-md border border-red-800">難度：★☆☆ (基礎)</span>
        </div>
        <div class="hidden md:flex items-center space-x-2">
          <button onclick="navigateQuestion(-1)" class="px-3.5 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-bold rounded-xl text-sm touch-btn border-2 border-black"><i class="fa-solid fa-chevron-left mr-1"></i> 上一題</button>
          <button onclick="navigateQuestion(1)" class="px-3.5 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-bold rounded-xl text-sm touch-btn border-2 border-black">下一題 <i class="fa-solid fa-chevron-right ml-1"></i></button>
        </div>
      </div>

      <div class="bg-neutral-900 border-2 border-black shadow-[6px_6px_0_rgba(37,99,235,0.55)] rounded-xl flex items-center gap-3 p-2 sm:p-3 speedlines">
        <img id="mascot-img" src="images/jjk-gojo.jpg" alt="mascot" class="w-14 h-14 sm:w-16 sm:h-16 object-cover rounded-md border-2 border-black shadow-[3px_3px_0_#000]">
        <div class="min-w-0">
          <div id="mascot-name" class="text-xs font-black text-sky-400 mb-0.5">五條 悟 (特級咒術師)</div>
          <div id="mascot-quote" class="text-xs sm:text-sm text-neutral-300 font-medium leading-snug">「天上天下，唯我獨尊。」聽好了，標準解法都在這裡！</div>
        </div>
      </div>

      <div class="text-base sm:text-xl font-bold text-neutral-100 leading-relaxed min-h-[60px] font-display" id="q-stem">載入題目中...</div>
      <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      <div id="feedback-box" class="hidden p-4 rounded-xl text-sm font-bold flex items-center space-x-3"></div>

      <div id="teaching-section" class="flex-1 flex flex-col gap-4">
        <div class="flex items-center justify-between gap-2 sm:gap-3 bg-neutral-900/80 p-2.5 sm:p-3 rounded-2xl border-2 border-neutral-700 flex-wrap sm:flex-nowrap">
          <button onclick="toggleHint()" class="flex-1 py-2.5 px-3 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center space-x-1.5 touch-btn border-2 border-black shadow-[3px_3px_0_#000]"><i class="fa-solid fa-lightbulb"></i><span>咒術師提示</span></button>
          <button onclick="toggleSteps()" class="flex-1 py-2.5 px-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center space-x-1.5 touch-btn border-2 border-black shadow-[3px_3px_0_#000]"><i class="fa-solid fa-book-open"></i><span>都立標準解題法</span></button>
          <button onclick="toggleVideo()" class="flex-1 py-2.5 px-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center space-x-1.5 touch-btn border-2 border-black shadow-[3px_3px_0_#000]"><i class="fa-brands fa-youtube"></i><span>術式影音解說</span></button>
        </div>
        <div id="hint-card" class="hidden bg-amber-500/10 rounded-2xl p-4 sm:p-5 border-2 border-amber-600 text-amber-200">
          <div class="flex items-center space-x-2 font-bold text-amber-300 mb-2"><i class="fa-solid fa-lightbulb text-amber-400 text-lg"></i><h3>咒術師的解題提示：</h3></div>
          <div id="hint-content" class="text-sm sm:text-base leading-relaxed font-medium"></div>
        </div>
        <div id="steps-card" class="hidden bg-sky-500/10 rounded-2xl p-4 sm:p-5 border-2 border-sky-600 text-sky-100">
          <div class="flex items-center space-x-2 font-bold text-sky-300 mb-3 border-b border-sky-800/60 pb-2"><i class="fa-solid fa-book-bookmark text-sky-400 text-lg"></i><h3>東京咒術高專標準解題步驟 (翰林/康軒/南一範式)：</h3></div>
          <div id="steps-content" class="space-y-3 text-sm sm:text-base"></div>
        </div>
        <div id="video-card" class="hidden bg-rose-500/10 rounded-2xl p-4 sm:p-5 border-2 border-rose-700 text-rose-100">
          <div class="flex items-center space-x-2 font-bold text-rose-300 mb-2 border-b border-rose-800/60 pb-2"><i class="fa-brands fa-youtube text-rose-500 text-xl"></i><h3 id="video-card-title"></h3></div>
          <p id="video-card-desc" class="text-xs sm:text-sm text-rose-300 mb-3 font-medium"></p>
          <div class="relative w-full overflow-hidden rounded-xl border-2 border-black bg-black aspect-video">
            <iframe id="youtube-iframe" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-neutral-950/95 backdrop-blur border-t-2 border-red-700 px-2 py-2 flex items-center gap-2">
    <button onclick="navigateQuestion(-1)" class="px-4 py-2.5 bg-neutral-800 text-neutral-200 font-bold rounded-xl touch-btn border-2 border-black"><i class="fa-solid fa-chevron-left"></i></button>
    <button onclick="submitCurrentQuiz()" class="flex-1 py-2.5 bg-red-600 text-white font-bold rounded-xl text-sm touch-btn border-2 border-black shadow-[3px_3px_0_#000]"><i class="fa-solid fa-check-circle mr-1"></i>送出檢定</button>
    <button onclick="navigateQuestion(1)" class="px-4 py-2.5 bg-neutral-800 text-neutral-200 font-bold rounded-xl touch-btn border-2 border-black"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <div id="result-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[70] flex items-center justify-center p-4 hidden">
    <div class="bg-neutral-900 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border-4 border-red-600 flex flex-col items-center text-center animate-bounce-short max-h-[90vh] overflow-y-auto">
      <img id="result-mascot" src="images/jjk-gojo.jpg" alt="result mascot" class="w-20 h-20 rounded-full object-cover border-4 border-black shadow-[4px_4px_0_#dc2626] mb-4">
      <h2 class="text-2xl font-black text-white mb-1 font-display">檢定完成！</h2>
      <p class="text-neutral-400 font-medium text-sm mb-4">咒術小學初級咒師測試・小五上數學</p>
      <div class="bg-neutral-950 rounded-2xl p-4 w-full grid grid-cols-3 gap-2 mb-4 border-2 border-neutral-700">
        <div class="flex flex-col items-center"><span class="text-xs text-neutral-400 font-bold mb-1">祓除題數</span><span id="result-score" class="text-xl sm:text-2xl font-black text-emerald-400">0/50</span></div>
        <div class="flex flex-col items-center"><span class="text-xs text-neutral-400 font-bold mb-1">檢定得分</span><span id="result-percentage" class="text-xl sm:text-2xl font-black text-red-400">0分</span></div>
        <div class="flex flex-col items-center"><span class="text-xs text-neutral-400 font-bold mb-1">獲得咒力</span><span id="result-energy" class="text-xl sm:text-2xl font-black text-amber-400">+0</span></div>
      </div>
      <div id="result-advice" class="text-sm text-neutral-300 mb-6 bg-red-950/30 p-3 rounded-xl border border-red-800 text-left w-full"></div>
      <div class="flex w-full space-x-3">
        <button onclick="closeResultModal()" class="flex-1 py-3 bg-neutral-700 hover:bg-neutral-600 text-white font-bold rounded-xl text-sm touch-btn border-2 border-black">檢視答題</button>
        <button onclick="restartQuiz()" class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm touch-btn border-2 border-black shadow-[3px_3px_0_#000]">再次修行</button>
      </div>
    </div>
  </div>

  <div id="blackflash-overlay" class="fixed inset-0 z-[80] pointer-events-none hidden items-center justify-center bg-black/85">
    <div class="flash-text font-display text-6xl sm:text-8xl font-black text-red-500 tracking-widest" style="text-shadow:0 0 40px #dc2626">黑閃<span class="text-white">！</span></div>
  </div>
  <div id="rankup-overlay" class="fixed inset-0 z-[80] pointer-events-none hidden items-center justify-center bg-black/85">
    <div class="flash-text flex flex-col items-center">
      <span class="text-amber-400 font-display text-2xl sm:text-3xl font-black tracking-widest mb-2">咒術師階級晉升</span>
      <span id="rankup-text" class="text-red-500 font-display text-5xl sm:text-7xl font-black tracking-widest" style="text-shadow:0 0 40px #dc2626">三級咒術師</span>
    </div>
  </div>

  <div id="mobile-overlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden"></div>

  <script src="questions.js"></script>
  <script>
    const IMG = {
      banner: "images/jjk-banner.jpg",
      gojo: "images/jjk-gojo.jpg",
      sukuna: "images/jjk-sukuna.jpg",
      itadori: "images/jjk-itadori.jpg"
    };

    const MASCOTS = {
      teach: {
        img: IMG.gojo, name: "五條 悟 (特級咒術師)",
        neutral: "「天上天下，唯我獨尊。」聽好了，標準解法都在這裡！",
        happy: ["哦？不錯嘛，有點特級的資質。", "完美！這就是我的學生！"],
        sad: ["唉，回去特訓一百次。", "別讓我看笑話啊，再想一次。"],
        flash: ["黑閃？！小子，你今天是主角啊！"]
      },
      real: {
        img: IMG.itadori, name: "虎杖 悠仁 (三級咒術師)",
        neutral: "檢定開始！讓我們把 50 隻咒靈全部祓除吧！",
        happy: ["太讚了！祓除成功！", "好耶！繼續保持這個氣勢！"],
        sad: ["唔哇！被咒靈反擊了…再試一次！"],
        flash: ["這就是黑閃的感覺嗎？太誇張了吧！"]
      },
      hard: {
        img: IMG.sukuna, name: "兩面宿儺 (詛咒之王)",
        neutral: "知道自己幾兩重了嗎，愚者。撐不過領域展開就別當咒術師。",
        happy: ["哼，勉強及格的螻蟻。", "有趣…再讓我享受一點吧。"],
        sad: ["就這點本事？真是讓人發笑。"],
        flash: ["黑閃嗎…有點意思，螻蟻。"]
      }
    };

    const RANKS = [
      { name: "四級咒術師", min: 0 },
      { name: "三級咒術師", min: 200 },
      { name: "二級咒術師", min: 600 },
      { name: "一級咒術師", min: 1200 },
      { name: "特級咒術師", min: 2000 }
    ];
    const MODE_MULT = { teach: 1, real: 1.5, hard: 2 };
    let totalEnergy = parseInt(localStorage.getItem('jjk_energy') || '0', 10);
    let sessionEnergy = 0, combo = 0, quizSubmitted = false;

    const SoundFX = {
      ctx: null,
      muted: localStorage.getItem('jjk_muted') === '1',
      ensure: function(){
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      tone: function(f, dur, type, vol, delay, slide){
        if (!this.ctx) return;
        type = type || 'sine'; vol = (vol === undefined) ? 0.2 : vol; delay = delay || 0;
        const t = this.ctx.currentTime + delay;

      },

    function spawnRipple(btn, e){
      const rect = btn.getBoundingClientRect();
      const d = Math.max(rect.width, rect.height) * 1.2;
      const cx = (e && e.clientX ? e.clientX : rect.left + rect.width / 2) - rect.left;
      const cy = (e && e.clientY ? e.clientY : rect.top + rect.height / 2) - rect.top;
      const span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = d + 'px';
      span.style.left = (cx - d / 2) + 'px';
      span.style.top = (cy - d / 2) + 'px';
      btn.appendChild(span);
      setTimeout(function(){ span.remove(); }, 650);

    function selectOption(optIdx, e){

      if (firstTime && currentMode === 'teach') {
        if (optIdx === q.answer) {

    function stopTimer(){ if (testTimer) clearInterval(testTimer); }
    function updateTimerDisplay(){
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = m + ':' + s;
    }

    function submitCurrentQuiz(){
      stopTimer();
      SoundFX.play('click');
      let correctCount = 0;
      const total = questionsList.length;
      questionsList.forEach(function(q, idx){ if (userAnswers[idx] === q.answer) correctCount++; });
      const scorePercent = total ? Math.round((correctCount / total) * 100) : 0;

      if (currentMode !== 'teach' && !quizSubmitted) {
        let gained = 0;
        questionsList.forEach(function(q, idx){ if (userAnswers[idx] === q.answer) gained += energyOf(q) * MODE_MULT[currentMode]; });
        gained = Math.round(gained);
        if (gained > 0) addEnergy(gained);
        if (scorePercent >= 90) triggerBlackFlash();
        else if (scorePercent >= 70) { SoundFX.play('correct'); setMascotEmotion('happy'); }
        else { SoundFX.play('wrong'); setMascotEmotion('sad'); }
      }
      quizSubmitted = true;

      document.getElementById('result-score').innerText = correctCount + ' / ' + total;
      document.getElementById('result-percentage').innerText = scorePercent + '分';
      document.getElementById('result-energy').innerText = '+' + sessionEnergy;

      const advice = document.getElementById('result-advice'), mascotImg = document.getElementById('result-mascot');
      if (scorePercent >= 90) { mascotImg.src = IMG.gojo; advice.innerHTML = '🌟 <strong>特級咒術師！</strong>「不錯嘛，你已經掌握小五上全部數學咒式。」請繼續保持！'; }
      else if (scorePercent >= 70) { mascotImg.src = IMG.itadori; advice.innerHTML = '👍 <strong>一級咒術師！</strong> 基礎觀念紮實，錯題可切換「咒術教學」查看標準解法復習。'; }
      else { mascotImg.src = IMG.sukuna; advice.innerHTML = '💪 <strong>四級咒術師，繼續修行！</strong>「知道自己幾兩重了嗎？」多利用提示與解題步驟釐清題意。'; }
      document.getElementById('result-modal').classList.remove('hidden');
    }
    function closeResultModal(){ document.getElementById('result-modal').classList.add('hidden'); }
    function restartQuiz(){
      closeResultModal();
      userAnswers = {};
      currentQuestionIndex = 0;
      combo = 0; sessionEnergy = 0; quizSubmitted = false;
      expandedUnits = new Set();
      if (currentMode !== 'teach') startTimer();
      updateMascot();
      refresh();
    }

    function toggleMobileSidebar(){
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('mobile-overlay').classList.toggle('hidden');
      SoundFX.play('click');
    }
    function closeMobileSidebar(){
      const sb = document.getElementById('sidebar');
      if (!sb.classList.contains('-translate-x-full')) toggleMobileSidebar();
    }

    function switchMode(mode){
      currentMode = mode;
      userAnswers = {};
      currentQuestionIndex = 0;
      combo = 0; sessionEnergy = 0; quizSubmitted = false;
      expandedUnits = new Set();
      const badge = document.getElementById('current-mode-badge');
      const active = 'flex-1 md:flex-none px-3 py-2 sm:px-4 rounded-lg transition-all duration-200 bg-red-600 text-white border-2 border-black shadow-[3px_3px_0_#000] font-bold';
      const inactive = 'flex-1 md:flex-none px-3 py-2 sm:px-4 rounded-lg transition-all duration-200 text-neutral-300 hover:text-white hover:bg-neutral-800 border-2 border-transparent font-bold';
      document.getElementById('mode-teach-btn').className = mode === 'teach' ? active : inactive;
      document.getElementById('mode-real-btn').className = mode === 'real' ? active : inactive;
      document.getElementById('mode-hard-btn').className = mode === 'hard' ? active : inactive;

      if (mode === 'teach') {
        badge.innerText = '咒術教學模式';
        badge.className = 'bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-bold border border-amber-600';
        document.getElementById('teaching-section').classList.remove('hidden');
        document.getElementById('test-timer-box').classList.add('hidden');
        stopTimer();
        questionsList = generateTeachingQuestions();
      } else if (mode === 'real') {
        badge.innerText = '等級檢定模式';
        badge.className = 'bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-bold border border-emerald-600';
        document.getElementById('teaching-section').classList.add('hidden');
        document.getElementById('test-timer-box').classList.remove('hidden');
        startTimer();
        questionsList = generateExamQuestions(false);
        SoundFX.play('click');
      } else {
        badge.innerText = '領域展開模式';
        badge.className = 'bg-rose-500/20 text-rose-300 text-xs px-2.5 py-1 rounded-full font-bold border border-rose-600';
        document.getElementById('teaching-section').classList.add('hidden');
        document.getElementById('test-timer-box').classList.remove('hidden');
        startTimer();
        questionsList = generateExamQuestions(true);
        SoundFX.play('domain');
      }
      updateMascot();
      refresh();
    }

    window.onload = async function(){
      document.getElementById('toggle-sidebar-btn').onclick = toggleMobileSidebar;
      updateSoundIcon();
      updateEnergyUI();
      await loadTeachingData();
      switchMode('teach');
    };
  </script>
</body>
</html>
