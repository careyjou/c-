<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國小五年級上學期數學 互動教學與測驗系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Scrollbar Styling for Tablet */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Tablet Touch Active Feedback */
    .touch-btn {
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    .touch-btn:active {
      transform: scale(0.96);
    }

    /* Custom fraction formatting */
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
    }
    .fraction .numerator {
      border-bottom: 2px solid currentColor;
      padding-bottom: 1px;
    }
    .fraction .denominator {
      padding-top: 1px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button id="toggle-sidebar-btn" class="p-2 rounded-lg bg-indigo-700 hover:bg-indigo-800 text-white md:hidden touch-btn">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <div class="flex items-center space-x-2">
          <span class="bg-yellow-400 text-indigo-950 font-black px-2.5 py-1 rounded-md text-sm sm:text-base">小五上</span>
          <h1 class="text-lg sm:text-2xl font-bold tracking-wide">數學互動教學與測驗系統</h1>
        </div>
      </div>

      <!-- Mode Switcher Tabs for Tablet/Desktop -->
      <div class="flex bg-indigo-800 p-1 rounded-xl shadow-inner text-xs sm:text-sm font-bold">
        <button id="mode-teach-btn" onclick="switchMode('teach')" class="px-3 py-2 sm:px-4 sm:py-2 rounded-lg transition-all duration-200 bg-white text-indigo-700 shadow">
          <i class="fa-solid fa-lightbulb text-amber-500 mr-1 sm:mr-1.5"></i>教學題 (50)
        </button>
        <button id="mode-real-btn" onclick="switchMode('real')" class="px-3 py-2 sm:px-4 sm:py-2 rounded-lg transition-all duration-200 text-indigo-100 hover:text-white">
          <i class="fa-solid fa-pen-clip text-emerald-300 mr-1 sm:mr-1.5"></i>真實題 (50)
        </button>
        <button id="mode-hard-btn" onclick="switchMode('hard')" class="px-3 py-2 sm:px-4 sm:py-2 rounded-lg transition-all duration-200 text-indigo-100 hover:text-white">
          <i class="fa-solid fa-fire text-rose-400 mr-1 sm:mr-1.5"></i>困難題 (50)
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col md:flex-row p-3 sm:p-5 gap-4">
    
    <!-- Sidebar: Question Navigation & Unit Filters -->
    <aside id="sidebar" class="w-full md:w-80 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col shrink-0 overflow-hidden hidden md:flex">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-layer-group text-indigo-600"></i>
          <h2 class="font-bold text-slate-700">題目導覽與單元順序</h2>
        </div>
        <span id="current-mode-badge" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">
          教學練習模式
        </span>
      </div>

      <!-- Unit Filter -->
      <div class="p-3 border-b border-slate-100 bg-slate-50/50">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">依單元篩選：</label>
        <select id="unit-filter" onchange="filterQuestionsByUnit()" class="w-full bg-white border border-slate-300 text-slate-700 rounded-lg p-2 text-xs font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="all">🌟 全部 50 題 (依單元與難度排序)</option>
          <option value="1">1. 因數與倍數 (第 1~9 題)</option>
          <option value="2">2. 異分母分數加減 (第 10~18 題)</option>
          <option value="3">3. 多邊形與內角和 (第 19~26 題)</option>
          <option value="4">4. 平面圖形面積 (第 27~35 題)</option>
          <option value="5">5. 小數乘法 (第 36~43 題)</option>
          <option value="6">6. 線對稱圖形 (第 44~50 題)</option>
        </select>
      </div>

      <!-- Question Grid (1-50) -->
      <div class="p-3 flex-1 overflow-y-auto">
        <div class="text-xs font-bold text-slate-400 mb-2 flex justify-between items-center">
          <span>題目列表</span>
          <span id="progress-text" class="text-indigo-600">已完成 0 / 50</span>
        </div>
        <div id="question-grid" class="grid grid-cols-5 gap-2">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

      <!-- Quiz Summary / Timer Box -->
      <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
        <div id="test-timer-box" class="hidden flex items-center justify-between bg-indigo-50 p-3 rounded-xl border border-indigo-100">
          <span class="text-xs font-bold text-indigo-700"><i class="fa-regular fa-clock mr-1"></i>測驗時間</span>
          <span id="timer-display" class="font-mono font-bold text-indigo-900 text-lg">00:00</span>
        </div>
        
        <button id="submit-quiz-btn" onclick="submitCurrentQuiz()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow text-sm flex items-center justify-center space-x-2 touch-btn">
          <i class="fa-solid fa-check-circle"></i>
          <span>送出本次測驗並評分</span>
        </button>
      </div>
    </aside>

    <!-- Main Question Workspace -->
    <main class="flex-1 flex flex-col gap-4 overflow-hidden">
        <!-- Question Header Info -->
        <div class="flex items-center justify-between flex-wrap gap-2 pb-3 border-b border-slate-100">
          <div class="flex items-center space-x-2 sm:space-x-3">
            <span id="q-number-badge" class="bg-indigo-600 text-white font-black px-3 py-1 rounded-lg text-lg">
              第 1 題
            </span>
            <span id="q-unit-tag" class="bg-indigo-50 text-indigo-700 text-xs sm:text-sm font-bold px-3 py-1 rounded-md border border-indigo-100">
              單元：1. 因數與倍數
            </span>
            <span id="q-diff-tag" class="bg-amber-50 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-md border border-amber-200">
              難度：★☆☆ (基礎)
            </span>
          </div>
          
          <div class="flex items-center space-x-2">
            <button onclick="navigateQuestion(-1)" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm touch-btn flex items-center">
              <i class="fa-solid fa-chevron-left mr-1"></i> 上一題
            </button>
            <button onclick="navigateQuestion(1)" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm touch-btn flex items-center">
              下一題 <i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
          </div>
        </div>

        <!-- Question Title / Stem -->
        <div class="text-base sm:text-xl font-bold text-slate-800 leading-relaxed min-h-[60px]" id="q-stem">
          載入題目中...
        </div>

        <!-- Options Container -->
        <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
          <!-- Populated dynamically -->
        </div>

        <!-- Feedback & Status Box -->
        <div id="feedback-box" class="hidden p-4 rounded-xl text-sm font-bold flex items-center space-x-3">
          <i id="feedback-icon" class="text-2xl"></i>
          <span id="feedback-msg"></span>
        </div>

      </div>

      <!-- Teaching Toolbar & Interactive Teaching Section (Visible only in Teaching Mode) -->
      <div id="teaching-section" class="flex-1 flex flex-col gap-4">
        
        <!-- Action Buttons Bar for Teaching -->
        <div class="flex items-center justify-between gap-3 bg-indigo-50/80 p-3 rounded-2xl border border-indigo-100 flex-wrap sm:flex-nowrap">
          <button onclick="toggleHint()" class="flex-1 py-2.5 px-3 sm:px-4 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold rounded-xl text-xs sm:text-sm shadow-sm flex items-center justify-center space-x-1.5 touch-btn">
            <i class="fa-solid fa-lightbulb"></i>
            <span>觀念提示</span>
          </button>
          
          <button onclick="toggleSteps()" class="flex-1 py-2.5 px-3 sm:px-4 bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-bold rounded-xl text-xs sm:text-sm shadow-sm flex items-center justify-center space-x-1.5 touch-btn">
            <i class="fa-solid fa-book-open"></i>
            <span>課本標準解題法</span>
          </button>

          <button onclick="toggleVideo()" class="flex-1 py-2.5 px-3 sm:px-4 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold rounded-xl text-xs sm:text-sm shadow-sm flex items-center justify-center space-x-1.5 touch-btn">
            <i class="fa-brands fa-youtube text-base"></i>
            <span>單元影音解說</span>
          </button>
        </div>

        <!-- Hint Card (Collapsible) -->
        <div id="hint-card" class="hidden bg-amber-50 rounded-2xl p-4 sm:p-5 border border-amber-200 text-amber-900 shadow-sm transition-all">
          <div class="flex items-center space-x-2 font-bold text-amber-800 mb-2">
            <i class="fa-solid fa-lightbulb text-amber-500 text-lg"></i>
            <h3>解題觀念提示：</h3>
          </div>
          <div id="hint-content" class="text-sm sm:text-base leading-relaxed font-medium">
            提示內容載入中...
          </div>
        </div>

        <!-- Textbook Steps Card (Collapsible) -->
        <div id="steps-card" class="hidden bg-sky-50 rounded-2xl p-4 sm:p-5 border border-sky-200 text-sky-950 shadow-sm transition-all">
          <div class="flex items-center space-x-2 font-bold text-sky-800 mb-3 border-b border-sky-200/60 pb-2">
            <i class="fa-solid fa-book-bookmark text-sky-600 text-lg"></i>
            <h3>課本標準解題步驟 (翰林/康軒/南一範式)：</h3>
          </div>
          <div id="steps-content" class="space-y-3 text-sm sm:text-base">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- YouTube Educational Video Card (Collapsible) -->
        <div id="video-card" class="hidden bg-rose-50 rounded-2xl p-4 sm:p-5 border border-rose-200 text-rose-950 shadow-sm transition-all">
          <div class="flex items-center space-x-2 font-bold text-rose-800 mb-2 border-b border-rose-200/60 pb-2">
            <i class="fa-brands fa-youtube text-rose-600 text-xl"></i>
            <h3 id="video-card-title">單元影音解說微課程</h3>
          </div>
          <p id="video-card-desc" class="text-xs sm:text-sm text-rose-700 mb-3 font-medium">
            搭配優質數位教學影片，強化學習觀念：
          </p>
          <div class="relative w-full overflow-hidden rounded-xl border border-rose-200 bg-black aspect-video shadow-md">
            <iframe id="youtube-iframe" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Score & Result Modal -->
  <div id="result-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 flex flex-col items-center text-center animate-bounce-short">
      <div id="score-icon-bg" class="w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-4xl mb-4">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-800 mb-1">測驗完成！</h2>
      <p id="result-subtitle" class="text-slate-500 font-medium text-sm mb-4">台灣國小五年級上學期數學測驗</p>

      <div class="bg-slate-50 rounded-2xl p-4 w-full grid grid-cols-2 gap-4 mb-6 border border-slate-200">
        <div class="flex flex-col items-center">
          <span class="text-xs text-slate-500 font-bold mb-1">答對題數</span>
          <span id="result-score" class="text-3xl font-black text-emerald-600">0 / 50</span>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-xs text-slate-500 font-bold mb-1">測驗得分</span>
          <span id="result-percentage" class="text-3xl font-black text-indigo-600">0分</span>
        </div>
      </div>

      <div id="result-advice" class="text-sm text-slate-600 mb-6 bg-indigo-50/60 p-3 rounded-xl border border-indigo-100 text-left w-full">
        診斷建議載入中...
      </div>

      <div class="flex w-full space-x-3">
        <button onclick="closeResultModal()" class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-sm touch-btn">
          檢視答題與錯題
        </button>
        <button onclick="restartQuiz()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow touch-btn">
          重新測驗
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Sidebar Drawer Overlay -->
  <div id="mobile-overlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

  <script>
    
    // Application State
    let currentMode = 'teach'; 
    let currentFilteredUnit = 'all';
    let currentQuestionIndex = 0;
    let questionsList = [];
    let userAnswers = {}; 
    let testTimer = null;
    let secondsElapsed = 0;

    // Unit Definitions
    const UNITS = {
      1: "1. 因數與倍數",
      2: "2. 異分母分數加減",
      3: "3. 多邊形與內角和",
      4: "4. 平面圖形面積",
      5: "5. 小數乘法",
      6: "6. 線對稱圖形"
    };

    // YouTube Teaching Video Database mapped by Unit ID
    const UNIT_VIDEOS = {
      1: {
        title: "📹 單元 1：【均一教育平台】因數與倍數 & 最大公因數觀念解說",
        embedId: "NEafa4sDswc",
        desc: "觀看均一教育平台的優質影音，快速掌握因數、倍數與最大公因數的定義與解題技巧。"
      },
      2: {
        title: "📹 單元 2：【均一教育平台】異分母分數的通分與加減",
        embedId: "dO7NhJ9TBo8",
        desc: "觀看影音解說，釐清分數加減時如何利用最小公倍數進行通分。"
      },
      3: {
        title: "📹 單元 3：【均一教育平台】多邊形內角和公式與分割說明",
        embedId: "iTbZzMPy0B8",
        desc: "學習如何將多邊形畫對角線分割成三角形，推導出 (n-2)×180° 的內角和公式。"
      },
      4: {
        title: "📹 單元 4：【均一教育平台】平行四邊形、三角形與梯形面積計算",
        embedId: "VGZ9AuQ1ZEw",
        desc: "觀看梯形與平面圖形面積公式的割補由來與計算示範。"
      },
      5: {
        title: "📹 單元 5：【均一教育平台】小數乘以整數與小數乘法",
        embedId: "O6LpX8Chjpk",
        desc: "瞭解小數乘法中，積的小數位數決定方式與直式運算技巧。"
      },
      6: {
        title: "📹 單元 6：【均一教育平台】線對稱圖形與對稱軸性質",
        embedId: "gBIQHJMoZp4",
        desc: "透過動畫與實例，認識對稱軸、對稱點、對稱邊與對摺重合的幾何特性。"
      }
    };

    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    function lcm(a, b) { return (a * b) / gcd(a, b); }

    // Generate 50 Teaching Questions ordered strictly Unit 1->6, Easy->Hard within each unit
    function generateTeachingQuestions() {
      const list = [];

      // ==========================================
      // 單元 1：因數與倍數 (第 1 ~ 9 題)
      // ==========================================
      list.push({
        unit: 1, difficulty: "★☆☆ (基礎)",
        stem: "下列哪一個數是 36 的因數？",
        options: ["5", "8", "9", "10"],
        answer: 2,
        hint: "如果 36 除以該數可以整除（餘數為 0），則該數為 36 的因數。",
        steps: ["驗證：36 ÷ 9 = 4 ... 餘 0，故 9 是 36 的因數。"]
      });
      list.push({
        unit: 1, difficulty: "★☆☆ (基礎)",
        stem: "1 到 40 的自然數中，8 的倍數共有幾個？",
        options: ["3 個", "4 個", "5 個", "6 個"],
        answer: 2,
        hint: "計算 40 除以 8 的商數，即可得到倍數的總個數。",
        steps: ["40 ÷ 8 = 5，分別為 8, 16, 24, 32, 40，共 5 個。"]
      });
      list.push({
        unit: 1, difficulty: "★★☆ (進階)",
        stem: "請找出 18 與 24 的所有「公因數」有哪些？",
        options: ["1, 2, 3, 6", "1, 2, 4, 8", "1, 3, 6, 9", "1, 2, 3, 4, 6"],
        answer: 0,
        hint: "分別列出 18 與 24 的因數，再找出兩者共同的因數。",
        steps: [
          "18 的因數：1, 2, 3, 6, 9, 18",
          "24 的因數：1, 2, 3, 4, 6, 8, 12, 24",
          "共同的公因數為：1, 2, 3, 6。"
        ]
      });
      list.push({
        unit: 1, difficulty: "★★☆ (進階)",
        stem: "12 與 15 的「最小公倍數」是多少？",
        options: ["30", "60", "90", "120"],
        answer: 1,
        hint: "利用短除法或列舉倍數，找出同時能被 12 和 15 整除的最小正整數。",
        steps: ["12 的倍數：12, 24, 36, 48, 60...；15 的倍數：15, 30, 45, 60...。最小公倍數為 60。"]
      });
      list.push({
        unit: 1, difficulty: "★★☆ (應用)",
        stem: "媽媽將 24 顆蘋果和 36 顆橘子平分給小朋友，每人分到的蘋果要一樣多，橘子也要一樣多。最多可以分給幾位小朋友？",
        options: ["4 位", "6 位", "12 位", "24 位"],
        answer: 2,
        hint: "「最多可以分給幾人」求的是 24 和 36 的最大公因數 (GCD)。",
        steps: ["24 與 36 的最大公因數為 12，故最多可分給 12 位小朋友。"]
      });
      list.push({
        unit: 1, difficulty: "★★☆ (應用)",
        stem: "公車 A 每 15 分鐘發一班，公車 B 每 20 分鐘發一班。若早上 8:00 兩車同時開出，下一次兩車同時發車是幾點幾分？",
        options: ["8:35", "9:00", "9:20", "10:00"],
        answer: 1,
        hint: "下一次同時發車的時間間隔是 15 與 20 的最小公倍數 (LCM)。",
        steps: ["15 與 20 的最小公倍數是 60 分鐘（1 小時）。8:00 + 1 小時 = 9:00。"]
      });
      list.push({
        unit: 1, difficulty: "★★★ (挑戰)",
        stem: "有一個三位數 54□，它既是 2 的倍數，也是 3 的倍數，請問個位數字 □ 可能填入的數字最大是多少？",
        options: ["4", "6", "8", "9"],
        answer: 1,
        hint: "2 的倍數個位數必須是偶數(0,2,4,6,8)；3 的倍數各位數字和必須能被 3 整除。",
        steps: [
          "各數字和：5 + 4 + □ = 9 + □。",
          "為使 9 + □ 是 3 的倍數，且 □ 是偶數，可能值有 □ = 0, 6。",
          "其中最大的是 6。"
        ]
      });
      list.push({

      // ==========================================

        hint: "長方形連接兩對邊中點的直線為對稱軸，對角線折起來無法重合。",

      list.push({

      list.push({
        unit: 6, difficulty: "★★☆ (進階)",
        stem: "圓形共有幾條對稱軸？",
        options: ["1 條", "2 條", "360 條", "無數條"],

        hint: "通過圓心的任何一條直線（直徑所在的直線）都是圓的對稱軸。",

      list.push({

    // Generate Exam/Hard Questions sorted strictly by Unit 1->6, Easy->Hard
    function generateExamQuestions(isHard = false) {
      const list = [];
      const prefix = isHard ? "【困難挑戰】" : "【真實測驗】";

      for (let i = 1; i <= 50; i++) {
        let u = 1;
        let diffText = "★☆☆";
        if (i <= 9) { u = 1; diffText = i <= 3 ? "★☆☆" : (i <= 6 ? "★★☆" : "★★★"); }
        else if (i <= 18) { u = 2; diffText = i <= 12 ? "★☆☆" : (i <= 15 ? "★★☆" : "★★★"); }
        else if (i <= 26) { u = 3; diffText = i <= 21 ? "★☆☆" : (i <= 24 ? "★★☆" : "★★★"); }
        else if (i <= 35) { u = 4; diffText = i <= 29 ? "★☆☆" : (i <= 32 ? "★★☆" : "★★★"); }
        else if (i <= 43) { u = 5; diffText = i <= 38 ? "★☆☆" : (i <= 41 ? "★★☆" : "★★★"); }
        else { u = 6; diffText = i <= 46 ? "★☆☆" : (i <= 48 ? "★★☆" : "★★★"); }

        let q = {};
        if (!isHard) {
          // Standard Exam Questions sorted by Unit
          if (u === 1) {
            const numA = 12 + i * 2;
            const numB = 18 + i * 2;
            const ans = gcd(numA, numB);
            q = {
              unit: 1, difficulty: diffText,
              stem: `${prefix} 求 ${numA} 與 ${numB} 的最大公因數？`,
              options: [`${ans}`, `${ans * 2}`, `${Math.max(1, ans - 1)}`, `${ans + 3}`],
              answer: 0
            };
          } else if (u === 2) {
            q = {
              unit: 2, difficulty: diffText,
              stem: `${prefix} 計算 <span class='fraction'><span class='numerator'>${i%3 + 1}</span><span class='denominator'>4</span></span> + <span class='fraction'><span class='numerator'>1</span><span class='denominator'>3</span></span> 的結果？`,
              options: [
                `<span class='fraction'><span class='numerator'>${(i%3 + 1)*3 + 4}</span><span class='denominator'>12</span></span>`,
                `<span class='fraction'><span class='numerator'>${i%3 + 2}</span><span class='denominator'>7</span></span>`,
                `<span class='fraction'><span class='numerator'>5</span><span class='denominator'>12</span></span>`,
                `<span class='fraction'><span class='numerator'>1</span><span class='denominator'>2</span></span>`
              ],
              answer: 0
            };
          } else if (u === 3) {
            const sides = 5 + (i % 5);
            const sum = (sides - 2) * 180;
            q = {
              unit: 3, difficulty: diffText,
              stem: `${prefix} 一個正 ${sides} 邊形的內角和是多少度？`,
              options: [`${sum}°`, `${sum + 180}°`, `${sum - 180}°`, `${sum / 2}°`],
              answer: 0
            };
          } else if (u === 4) {
            const b = 10 + i;
            const h = 6 + (i % 4);
            const area = (b * h) / 2;
            q = {
              unit: 4, difficulty: diffText,
              stem: `${prefix} 三角形的底為 ${b}cm，高為 ${h}cm，求面積？`,
              options: [`${area} cm²`, `${area * 2} cm²`, `${area + 5} cm²`, `${area - 3} cm²`],
              answer: 0
            };
          } else if (u === 5) {
            const val = (1.5 + (i * 0.1)).toFixed(1);
            const res = (parseFloat(val) * 2.4).toFixed(2);
            q = {
              unit: 5, difficulty: diffText,
              stem: `${prefix} 計算 ${val} × 2.4 等於多少？`,
              options: [`${res}`, `${(res * 10).toFixed(1)}`, `${(res / 10).toFixed(3)}`, `${(parseFloat(res) + 0.12).toFixed(2)}`],
              answer: 0
            };
          } else {
            q = {
              unit: 6, difficulty: diffText,
              stem: `${prefix} 正方形共有幾條對稱軸？`,
              options: ["4 條", "2 條", "8 條", "無數條"],
              answer: 0
            };
          }
        } else {
          // Hard Questions sorted by Unit
          if (u === 1) {
            q = {
              unit: 1, difficulty: diffText,
              stem: `${prefix} 某數加上 3 後是 15 與 20 的公倍數，已知該數小於 200，請問該數最大是多少？`,
              options: ["177", "180", "117", "120"],
              answer: 0
            };
          } else if (u === 2) {
            q = {
              unit: 2, difficulty: diffText,
              stem: `${prefix} 計算 4<span class='fraction'><span class='numerator'>1</span><span class='denominator'>6</span></span> - 1<span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span> + 2<span class='fraction'><span class='numerator'>2</span><span class='denominator'>3</span></span> 的結果？`,
              options: [
                "5<span class='fraction'><span class='numerator'>1</span><span class='denominator'>12</span></span>",
                "4<span class='fraction'><span class='numerator'>11</span><span class='denominator'>12</span></span>",
                "5<span class='fraction'><span class='numerator'>5</span><span class='denominator'>12</span></span>",
                "4<span class='fraction'><span class='numerator'>7</span><span class='denominator'>12</span></span>"
              ],
              answer: 0
            };
          } else if (u === 3) {
            q = {
              unit: 3, difficulty: diffText,
              stem: `${prefix} 一個正多邊形的每一個內角是 144°，請問這個多邊形是幾邊形？`,
              options: ["十邊形", "十二邊形", "八邊形", "九邊形"],
              answer: 0
            };
          } else if (u === 4) {
            q = {
              unit: 4, difficulty: diffText,
              stem: `${prefix} 一個梯形上底增加 4 公分後會變成平行四邊形，面積會增加 20 平方公分。若原梯形高為 10 公分，下底為 12 公分，求原梯形面積？`,
              options: ["100 平方公分", "120 平方公分", "80 平方公分", "90 平方公分"],
              answer: 0
            };
          } else if (u === 5) {
            q = {
              unit: 5, difficulty: diffText,
              stem: `${prefix} 一包白米 3.75 公斤售價 240 元，小明買了 2.4 包，一共要付多少元？`,
              options: ["576 元", "500 元", "600 元", "480 元"],
              answer: 0
            };
          } else {
            q = {
              unit: 6, difficulty: diffText,
              stem: `${prefix} 在直角座標平面上，點 A(2, 6) 對於對稱軸 L(x=4) 的對稱點 A' 座標為何？`,
              options: ["(6, 6)", "(4, 6)", "(2, 4)", "(8, 6)"],
              answer: 0
            };
          }
        }
        list.push(q);
      }
      return list;
    }


    function loadQuestion(index) {
      if (!questionsList[index]) return;
      const q = questionsList[index];

      document.getElementById('q-number-badge').innerText = `第 ${index + 1} 題`;
      document.getElementById('q-unit-tag').innerText = `單元：${UNITS[q.unit] || '綜合'}`;
      document.getElementById('q-diff-tag').innerText = `難度：${q.difficulty || '★☆☆'}`;
      document.getElementById('q-stem').innerHTML = q.stem;

      // Hide Hint, Steps & Video Cards on new question
      document.getElementById('hint-card').classList.add('hidden');
      document.getElementById('steps-card').classList.add('hidden');
      document.getElementById('video-card').classList.add('hidden');

      // Update YouTube video content according to current question's unit
      const videoInfo = UNIT_VIDEOS[q.unit];
      if (videoInfo) {
        document.getElementById('video-card-title').innerText = videoInfo.title;
        document.getElementById('video-card-desc').innerText = videoInfo.desc;
        const iframe = document.getElementById('youtube-iframe');
        iframe.src = `https://www.youtube.com/embed/${videoInfo.embedId}?rel=0`;
      }

      // Populate Options
      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';

      const selectedOpt = userAnswers[index];

      q.options.forEach((optText, optIdx) => {
        const isSelected = selectedOpt === optIdx;
        const isCorrect = optIdx === q.answer;

        let btnClass = "p-4 rounded-xl border-2 text-left font-bold text-sm sm:text-base flex items-center justify-between transition-all touch-btn ";

        if (selectedOpt !== undefined) {
          if (currentMode === 'teach') {
            if (isSelected && isCorrect) {
              btnClass += "border-emerald-500 bg-emerald-50 text-emerald-900";
            } else if (isSelected && !isCorrect) {
              btnClass += "border-rose-500 bg-rose-50 text-rose-900";
            } else if (isCorrect) {
              btnClass += "border-emerald-400 bg-emerald-50/50 text-emerald-800";
            } else {
              btnClass += "border-slate-200 bg-slate-50 text-slate-400";
            }
          } else {
            if (isSelected) {
              btnClass += "border-indigo-600 bg-indigo-50 text-indigo-900";
            } else {
              btnClass += "border-slate-200 bg-white text-slate-700 hover:bg-slate-50";
            }
          }
        } else {
          btnClass += "border-slate-200 bg-white hover:border-indigo-300 text-slate-700 hover:bg-indigo-50/30";
        }

        const optBtn = document.createElement('button');
        optBtn.className = btnClass;
        optBtn.onclick = () => selectOption(optIdx);

        const labelLetter = String.fromCharCode(65 + optIdx);
        optBtn.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="w-7 h-7 rounded-full bg-slate-100 border border-slate-300 text-slate-600 flex items-center justify-center text-xs font-black shrink-0">${labelLetter}</span>
            <span>${optText}</span>
          </div>
          ${selectedOpt !== undefined && currentMode === 'teach' ? (isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>' : (isSelected ? '<i class="fa-solid fa-circle-xmark text-rose-500 text-lg"></i>' : '')) : ''}
        `;

        optContainer.appendChild(optBtn);
      });

      // Feedback Box
      const fbBox = document.getElementById('feedback-box');
      if (selectedOpt !== undefined && currentMode === 'teach') {
        fbBox.classList.remove('hidden');
        if (selectedOpt === q.answer) {
          fbBox.className = "p-4 rounded-xl text-sm font-bold flex items-center space-x-3 bg-emerald-100 text-emerald-900 border border-emerald-200";
          document.getElementById('feedback-icon').className = "fa-solid fa-circle-check text-emerald-600 text-2xl";
          document.getElementById('feedback-msg').innerText = "答對了！非常優秀，可以對照下方解題步驟與觀念。";
        } else {
          fbBox.className = "p-4 rounded-xl text-sm font-bold flex items-center space-x-3 bg-rose-100 text-rose-900 border border-rose-200";
          document.getElementById('feedback-icon').className = "fa-solid fa-circle-xmark text-rose-500 text-2xl";
          document.getElementById('feedback-msg').innerText = `答錯了！正確答案是 (${String.fromCharCode(65 + q.answer)})。可以點擊觀念提示或解題步驟了解詳情。`;
        }
      } else {
        fbBox.classList.add('hidden');
      }

      if (q.hint) {
        document.getElementById('hint-content').innerText = q.hint;
      }
      if (q.steps) {
        const stepsContainer = document.getElementById('steps-content');
        stepsContainer.innerHTML = q.steps.map(s => `<div class="p-2.5 bg-white rounded-lg border border-sky-100 shadow-sm font-medium"><i class="fa-solid fa-arrow-right text-sky-500 mr-2"></i>${s}</div>`).join('');
      }
    }

    function selectOption(optIdx) {
      userAnswers[currentQuestionIndex] = optIdx;
      renderQuestionGrid();
      loadQuestion(currentQuestionIndex);
    }

    function navigateQuestion(direction) {
      const newIndex = currentQuestionIndex + direction;
      if (newIndex >= 0 && newIndex < questionsList.length) {
        currentQuestionIndex = newIndex;
        renderQuestionGrid();
        loadQuestion(currentQuestionIndex);
      }
    }

    function toggleHint() {
      const card = document.getElementById('hint-card');
      card.classList.toggle('hidden');
    }

    function toggleSteps() {
      const card = document.getElementById('steps-card');
      card.classList.toggle('hidden');
    }

    function toggleVideo() {
      const card = document.getElementById('video-card');
      card.classList.toggle('hidden');
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      updateTimerDisplay();
      testTimer = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (testTimer) clearInterval(testTimer);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }

    function submitCurrentQuiz() {
      stopTimer();

      let correctCount = 0;
      const total = questionsList.length;

      questionsList.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) {
          correctCount++;
        }
      });

      const scorePercent = Math.round((correctCount / total) * 100);

      document.getElementById('result-score').innerText = `${correctCount} / ${total}`;
      document.getElementById('result-percentage').innerText = `${scorePercent}分`;

      const advice = document.getElementById('result-advice');
      if (scorePercent >= 90) {
        advice.innerHTML = "🌟 <strong>太棒了！概念極佳！</strong> 你對五年級上學期的觀念掌握度非常高，請繼續保持高水準的思考歷程。";
      } else if (scorePercent >= 70) {
        advice.innerHTML = "👍 <strong>表現優良！</strong> 基礎觀念很紮實，部分錯題可以切換至「教學題模式」查看課本標準解題法進行復習。";
      } else {
        advice.innerHTML = "💪 <strong>加油！再接再厲！</strong> 建議多利用「觀念提示」與「解題步驟」功能，按部就班釐清題意。";
      }

      document.getElementById('result-modal').classList.remove('hidden');
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

    function restartQuiz() {
      closeResultModal();
      userAnswers = {};
      currentQuestionIndex = 0;
      if (currentMode !== 'teach') startTimer();
      renderQuestionGrid();
      loadQuestion(0);
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-overlay');

      sidebar.classList.toggle('hidden');
      overlay.classList.toggle('hidden');
    }

    function switchMode(mode) {
      currentMode = mode;
      userAnswers = {};
      currentQuestionIndex = 0;
      currentFilteredUnit = 'all';

      // Reset filter dropdown selection
      const filterSelect = document.getElementById('unit-filter');
      if (filterSelect) filterSelect.value = 'all';

      // Get UI elements
      const badge = document.getElementById('current-mode-badge');
      const teachBtn = document.getElementById('mode-teach-btn');
      const realBtn = document.getElementById('mode-real-btn');
      const hardBtn = document.getElementById('mode-hard-btn');
      const teachSec = document.getElementById('teaching-section');
      const timerBox = document.getElementById('test-timer-box');

      // Header button visual state styles
      const activeClass = "px-3 py-2 sm:px-4 sm:py-2 rounded-lg transition-all duration-200 bg-white text-indigo-700 shadow font-bold";
      const inactiveClass = "px-3 py-2 sm:px-4 sm:py-2 rounded-lg transition-all duration-200 text-indigo-100 hover:text-white font-bold";

      if (teachBtn) teachBtn.className = mode === 'teach' ? activeClass : inactiveClass;
      if (realBtn) realBtn.className = mode === 'real' ? activeClass : inactiveClass;
      if (hardBtn) hardBtn.className = mode === 'hard' ? activeClass : inactiveClass;

      if (mode === 'teach') {
        if (badge) {
          badge.innerText = '教學練習模式';
          badge.className = 'bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold';
        }
        if (teachSec) teachSec.classList.remove('hidden');
        if (timerBox) timerBox.classList.add('hidden');
        stopTimer();
        questionsList = generateTeachingQuestions();
      } else if (mode === 'real') {
        if (badge) {
          badge.innerText = '真實測驗模式';
          badge.className = 'bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold';
        }
        if (teachSec) teachSec.classList.add('hidden');
        if (timerBox) timerBox.classList.remove('hidden');
        startTimer();
        questionsList = generateExamQuestions(false);
      } else if (mode === 'hard') {
        if (badge) {
          badge.innerText = '困難挑戰模式';
          badge.className = 'bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-full font-bold';
        }
        if (teachSec) teachSec.classList.add('hidden');
        if (timerBox) timerBox.classList.remove('hidden');
        startTimer();
        questionsList = generateExamQuestions(true);
      }

      renderQuestionGrid();
      loadQuestion(0);
    }

    function filterQuestionsByUnit() {
      const filterVal = document.getElementById('unit-filter').value;
      currentFilteredUnit = filterVal;
      
      // Jump to the first question belonging to the selected unit
      let firstMatchIndex = 0;
      if (filterVal !== 'all') {
        const matchIdx = questionsList.findIndex(q => q.unit.toString() === filterVal);
        if (matchIdx !== -1) firstMatchIndex = matchIdx;
      }
      
      currentQuestionIndex = firstMatchIndex;
      renderQuestionGrid();
      loadQuestion(currentQuestionIndex);
    }

    function renderQuestionGrid() {
      const grid = document.getElementById('question-grid');
      if (!grid) return;
      grid.innerHTML = '';

      let answeredCount = Object.keys(userAnswers).length;
      document.getElementById('progress-text').innerText = `已完成 ${answeredCount} / ${questionsList.length}`;

      questionsList.forEach((q, idx) => {
        const isVisible = currentFilteredUnit === 'all' || q.unit.toString() === currentFilteredUnit;

        const btn = document.createElement('button');
        btn.innerText = idx + 1;
        
        let baseStyle = "w-full aspect-square rounded-lg font-bold text-xs flex items-center justify-center transition-all touch-btn ";
        
        if (!isVisible) {
          baseStyle += "opacity-30 ";
        }

        const isCurrent = idx === currentQuestionIndex;
        const isAnswered = userAnswers[idx] !== undefined;

        if (isCurrent) {
          baseStyle += "ring-2 ring-indigo-600 ring-offset-1 ";
        }

        if (isAnswered) {
          if (currentMode === 'teach') {
            const isCorrect = userAnswers[idx] === q.answer;
            baseStyle += isCorrect ? "bg-emerald-500 text-white" : "bg-rose-500 text-white";
          } else {
            baseStyle += "bg-indigo-600 text-white";
          }
        } else {
          baseStyle += "bg-slate-100 hover:bg-slate-200 text-slate-700";
        }

        btn.className = baseStyle;
        btn.onclick = () => {
          currentQuestionIndex = idx;
          renderQuestionGrid();
          loadQuestion(idx);
        };

        grid.appendChild(btn);
      });
    }

    // Initialize application on page load
    window.onload = function() {
      document.getElementById('toggle-sidebar-btn').onclick = toggleMobileSidebar;
      switchMode('teach');
    };
  </script>
</body>
</html>
